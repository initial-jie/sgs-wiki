<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>风声线下房间</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* 民国谍报档案:牛皮纸 + 油墨 + 红色密级章。阵营三色:潜伏红 / 特工蓝 / 神秘人绿;情报黑 */
:root{
  --paper:#e6d8b8; --paper2:#f3ead3; --card:rgba(250,244,228,.82);
  --ink:#231e17; --ink-soft:#5d5242; --line:rgba(70,55,30,.28);
  --stamp:#9e2b22; --red:#b3372b; --blue:#2c5b8c; --green:#3d7a4c; --black:#1f1d1a; --warn:#b7791f;
  --display:'Noto Serif SC','Songti SC','SimSun',serif;
  --body:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);
  background-image:repeating-linear-gradient(0deg,rgba(90,70,40,.035) 0 1px,transparent 1px 4px),
    radial-gradient(ellipse at 15% 0%,rgba(255,250,235,.6),transparent 55%);
  color:var(--ink);font-family:var(--body);line-height:1.6;padding:12px 16px 60px;max-width:560px;margin:0 auto}
h1{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.3em;text-align:center;margin:6px 0 0}
h1 .st{display:inline-block;font-size:11px;letter-spacing:.1em;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;
  padding:0 5px;margin-left:6px;transform:rotate(-8deg);vertical-align:middle;font-family:var(--body);font-weight:700}
.sub{text-align:center;color:var(--ink-soft);font-size:12px;letter-spacing:.14em;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);
  border-radius:6px;padding:12px 14px;margin-bottom:11px;box-shadow:0 1px 0 rgba(35,30,23,.12)}
.card.secret{border-left-color:var(--stamp)}
.card h2{font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:.1em;
  border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:10px}
.card h2 .tag{float:right;font-size:11px;color:var(--ink-soft);letter-spacing:0;font-weight:400;font-family:var(--body)}
label{font-size:13px;color:var(--ink-soft)}
input,select{font-family:inherit;font-size:14px;background:rgba(255,252,240,.95);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
button{font-family:inherit;font-size:14px;border-radius:6px;border:1px solid var(--line);
  background:var(--paper2);color:var(--ink);padding:8px 12px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper2);font-weight:600}
button.danger{background:var(--stamp);border-color:var(--stamp);color:#f8ecd6;font-weight:600}
button.ghost{background:transparent;color:var(--ink-soft)}
button.sm{font-size:12px;padding:4px 9px}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--ink-soft);margin-top:6px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--ink-soft)}
a{color:var(--blue)}
#connbar{display:none;position:fixed;left:0;right:0;top:0;z-index:9999;align-items:center;justify-content:center;gap:12px;
  padding:9px 14px;background:var(--stamp);color:#f8ecd6;font-size:13px;font-weight:600}
#connbar button{background:#f8ecd6;color:var(--stamp);border:none;padding:5px 14px;font-weight:700}
body.disconnected #connbar{display:flex}
body.disconnected #app{opacity:.5;pointer-events:none;filter:grayscale(.35)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper2);
  padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:10000;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 阵营 / 情报 */
.fac{display:inline-block;font-weight:700;border-radius:4px;padding:1px 8px;color:#fbf3df;font-size:13px}
.fac.red{background:var(--red)} .fac.blue{background:var(--blue)} .fac.green{background:var(--green)}
.intel{display:inline-block;width:22px;height:30px;border-radius:3px;margin:0 3px 3px 0;border:1px solid rgba(0,0,0,.25);vertical-align:middle;position:relative}
.intel.r{background:var(--red)} .intel.b{background:var(--blue)} .intel.k{background:var(--black)}
.intel.rk{background:linear-gradient(135deg,var(--red) 50%,var(--black) 50%)}
.intel.bk{background:linear-gradient(135deg,var(--blue) 50%,var(--black) 50%)}
.cnt{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cnt b.r{color:var(--red)} .cnt b.b{color:var(--blue)} .cnt b.k{color:var(--black)}

/* 座位列表(同三国杀房间:每座一框,认领/释放/替换/查看技能就在座位上) */
.seat{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px;background:rgba(255,252,240,.5)}
.seat.mine{border-color:var(--stamp);background:rgba(158,43,34,.05)}
.seat.turn{box-shadow:inset 4px 0 0 var(--ink)}
.seat.dead{opacity:.55}
.seat.dead .nm{text-decoration:line-through}
.seat .st{font-family:var(--display);font-weight:900;font-size:15px}
.seat .nm{font-weight:700;font-family:var(--display);margin-left:6px}
.seat .who{font-size:12px;color:var(--ink-soft)}
.seat .sub2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.seat .lbl{font-size:12px;color:var(--ink-soft)}
.btn-skill{border-color:var(--warn);color:#8a5a12;background:transparent;font-size:12px;padding:4px 9px}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin-left:5px;font-weight:700;vertical-align:1px}
.badge.dying{background:var(--stamp);color:#fff;animation:pulse 1.2s infinite}
.badge.dead{background:#6d655a;color:#fff}
.badge.me{border:1px solid var(--stamp);color:var(--stamp)}
.badge.turn{background:var(--ink);color:var(--paper2)}
.badge.hid{border:1px solid #4a4236;color:#4a4236}
@keyframes pulse{50%{opacity:.45}}
.hidden-card{display:inline-block;font-size:12px;background:repeating-linear-gradient(45deg,#3a332a 0 4px,#4a4236 4px 8px);color:#e9dcc0;
  border-radius:3px;padding:0 7px;font-weight:600;margin-left:6px}

/* 我的机密 */
.dossier{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.task{background:rgba(61,122,76,.08);border:1px dashed var(--green);border-radius:5px;padding:6px 9px;font-size:13px;margin-top:8px}
.winbtn{width:100%;margin-top:10px;font-size:17px;padding:12px;font-family:var(--display);font-weight:900;letter-spacing:.2em}

/* 结果 */
.result{border-left-color:var(--stamp);background:rgba(158,43,34,.07)}
.result .big{font-family:var(--display);font-weight:900;font-size:20px;text-align:center;letter-spacing:.15em;color:var(--stamp)}

/* 弹层(选角色 / 查看技能 / 情报与生死),样式同三国杀房间 */
.mask{position:fixed;inset:0;background:rgba(20,16,10,.5);z-index:80;display:flex;align-items:flex-start;
  justify-content:center;padding:34px 10px;overflow:auto}
.sheet{background:var(--paper2);border:1px solid var(--line);border-top:3px solid var(--stamp);border-radius:11px;
  width:100%;max-width:520px;padding:14px 15px;box-shadow:0 8px 30px rgba(35,30,23,.35)}
.sheet h2{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.06em;
  border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;font-size:20px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:0 4px}
.gsearch{position:sticky;top:0;background:var(--paper2);padding-bottom:8px;z-index:1}
.glist{max-height:56vh;overflow:auto;margin-top:4px}
.grow-item{display:flex;align-items:center;gap:9px;padding:8px 6px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:6px}
.grow-item:active{background:rgba(158,43,34,.07)}
.grow-item.taken{opacity:.5}
.ava{width:34px;height:34px;border-radius:6px;flex:none;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:900;font-size:17px;background:var(--paper);color:var(--ink)}
.ava.hid{background:repeating-linear-gradient(45deg,#3a332a 0 4px,#4a4236 4px 8px);color:#e9dcc0}
.ava.big{width:56px;height:56px;font-size:28px;border-radius:8px}
.grow-item .gn{font-family:var(--display);font-weight:700;font-size:15px}
.grow-item .gmeta{font-size:11px;color:var(--ink-soft)}
.gv{flex:none;font-size:12px;padding:5px 10px;border:1px solid var(--stamp);color:var(--stamp);background:transparent;border-radius:6px;white-space:nowrap}
.herohead{display:flex;gap:11px;align-items:center;margin-bottom:10px}
.herohead .hn{font-family:var(--display);font-weight:900;font-size:19px}
.herohead .hmeta{font-size:12px;color:var(--ink-soft)}
.skl{border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:8px;background:rgba(255,252,240,.6)}
.skl .sn{font-family:var(--display);font-weight:800;font-size:15px;color:var(--stamp);margin-bottom:3px}
.skl .se{font-size:13px;line-height:1.7}
.facechoice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.facechoice button{padding:10px 6px;line-height:1.35}
.facechoice small{display:block;font-size:11px;font-weight:400;opacity:.8}
.kinds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kinds button{padding:10px 0;font-weight:700;color:#fff;border:none}
.kinds .r{background:var(--red)} .kinds .b{background:var(--blue)} .kinds .k{background:var(--black)}
.kinds .rk{background:linear-gradient(135deg,var(--red) 50%,var(--black) 50%)} .kinds .bk{background:linear-gradient(135deg,var(--blue) 50%,var(--black) 50%)}
.ilist .intel{cursor:pointer}
.ilist .intel::after{content:"×";position:absolute;right:-5px;top:-7px;font-size:12px;background:var(--paper2);color:var(--ink);border-radius:50%;
  width:14px;height:14px;line-height:13px;text-align:center;border:1px solid var(--line)}
details summary{cursor:pointer;font-size:13px;color:var(--ink-soft)}
.ref p{font-size:13px;margin:4px 0}
.log{font-size:12px;color:var(--ink-soft);max-height:220px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px dotted var(--line)}
footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:18px;letter-spacing:.1em}
.num{width:64px;text-align:center}
</style>
</head>
<body>
<div id="connbar"><span>⚠ 连接已断开,正在重连…操作已暂停</span><button id="rcNow" type="button">立即重连</button></div>
<div id="app"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script src="/common/room-client.js"></script><!-- 公共房间客户端(连接/重连/改名/toast);见 prototype/common/client/ -->
<script>
/* 风声线下房间:桌上用实体牌,手机管「秘密信息(身份/隐藏角色/选角候选)+ 公开台账(情报区/生死/回合)+ 胜负判定」。
   权威逻辑在 DO(prototype/fengsheng/shared/fs-logic.mjs);这里只渲染 roomState 与发 action{op,…}。 */
const {esc,toast,$}=RoomClient;
let state=null, DATA=null;
let CHAR={}, TASK={};

const RC=RoomClient.create({
  wsPath: code=>"/api/fs/"+code+"/ws",
  errorText:{NOT_WIN_YET:"还没达成胜利条件",NO_IDENTITY:"你还没有身份",DEAD:"该角色已阵亡",GAME_OVER:"本局已结束,点「再来一局」",
    COUNT_MISMATCH:"身份配比总数要等于座位数",POOL_TOO_SMALL:"卡池角色不够发",NOT_OFFERED:"只能从发给你的候选里选",
    TOO_MANY_GREEN:"神秘人太多,任务不够分(可切到「全部」卡池)",NO_CHAR:"该座位还没选角色",CHAR_TAKEN:"这名角色已被别人公开选用"},
  beforeConnect(){ state=null; closeModal(); },
  onState(m){ state=m; render(); },
  onClosed(){ state=null; closeModal(); render(); },
  onRenamed(){ render(); },
});
function act(op,extra){ return RC.send(Object.assign({type:"action",op},extra||{})); }

fetch("/fs/data.json?v=__FS_DATA_VER__").then(r=>r.json()).then(d=>{
  DATA=d; CHAR=Object.fromEntries(d.characters.map(c=>[c.id,c])); TASK=Object.fromEntries(d.tasks.map(t=>[t.key,t])); render();
}).catch(()=>toast("角色数据加载失败,刷新重试"));

/* ============ 小工具 ============ */
const FNAME={red:"潜伏战线",blue:"特工机关",green:"神秘人"};
const facHtml=f=>`<span class="fac ${f}">${FNAME[f]}</span>`;
function idHtml(idn){ if(!idn) return ""; return facHtml(idn.faction)+(idn.task&&TASK[idn.task]?` <b>${esc(TASK[idn.task].name)}</b>`:""); }
const intelHtml=it=>`<span class="intel ${it.kind}" title="${esc(it.kind)}"></span>`;
function cntHtml(c){ return `<span class="cnt">红<b class="r">${c.red}</b> 蓝<b class="b">${c.blue}</b> 黑<b class="k">${c.black}</b></span>`; }
const seatsArr=()=>Object.values(state.seats).sort((a,b)=>a.seatNo-b.seatNo);
const mineSeats=()=>seatsArr().filter(s=>state.youHold.includes(s.seatNo));
// 座位上显示的角色:公开 → 名字;面朝下的隐藏角色 → 本人看得到名字(标「暗置」),他人只见「隐藏角色」
function charLabel(s){
  if(s.charId!=null&&CHAR[s.charId]){ const c=CHAR[s.charId];
    return `<span class="nm">${esc(c.name)}</span>`+(c.hidden?(s.faceUp?'<span class="badge hid">隐藏·已翻开</span>':'<span class="badge hid">暗置 · 仅你可见</span>'):""); }
  if(s.hasChar) return '<span class="hidden-card">隐藏角色</span>';
  return "";
}
function skillsHtml(c){ return c.skills.map(k=>`<div class="skl"><div class="sn">${esc(k.name)}</div><div class="se">${esc(k.text).replace(/\n/g,"<br>")}</div></div>`).join(""); }
const avaHtml=(c,big)=>`<div class="ava${c.hidden?" hid":""}${big?" big":""}">${esc(c.name[0])}</div>`;
function charMeta(c){ return `${esc(c.title)} · ${c.sex}${c.hidden?" · 隐藏角色":" · 公开角色"}${c.pack!=="base"?" · 扩展":""}`; }
// 别人已公开选用的角色(只看公开的,不泄露暗置)
function takenBy(cid,exceptSeat){ const s=seatsArr().find(x=>x.seatNo!==exceptSeat&&x.charId===cid&&x.faceUp); return s?s.seatNo:null; }

/* ---------- 弹层:modal = {t:"picker",seat} | {t:"skill",seat} | {t:"intel",seat} | {t:"char",id};preview 叠加在 picker 上 ---------- */
let modal=null;
function closeModal(){ modal=null; $("#modal").innerHTML=""; }
function rerenderModal(){ // 收到新 roomState 时刷新弹层(picker 只刷列表,不打断输入)
  if(!modal) return;
  if(modal.t==="picker"){ if(!state.seats[modal.seat]||!state.youHold.includes(modal.seat)) return closeModal(); renderPickerList(); return; }
  if(modal.t==="skill") return openSkillView(modal.seat);
  if(modal.t==="intel") return openIntelSheet(modal.seat);
}

// 选角色(同三国杀选将):中文/拼音/首字母搜索;发过 2 选 1 时只列候选
function openPicker(seatNo){
  if(!DATA){toast("角色数据还在加载…");return;}
  const s=state.seats[seatNo]; modal={t:"picker",seat:seatNo};
  const cur=s.charId!=null&&CHAR[s.charId]?CHAR[s.charId].name:"";
  $("#modal").innerHTML=`<div class="mask" data-mclose="1"><div class="sheet">
    <h2>选角色 · 座位 ${seatNo}<span class="x" data-a="close">×</span></h2>
    <div class="gsearch">${s.offers&&s.offers.length?`<div class="hint" style="margin:0 0 6px">已发角色:只能从发给你的 ${s.offers.length} 张里选。</div>`
      :`<input id="gq" placeholder="角色名或拼音,如 李宁玉 / lining / lny" autocomplete="off" autocapitalize="off">`}
      <div class="row" style="margin-top:6px">${cur?`<button class="ghost sm" data-a="clearChar" data-s="${seatNo}">清除角色</button>`:""}
        <span class="grow hint" style="text-align:right;margin:0">当前:${cur?esc(cur):"未选"} · 暗置的隐藏角色只有你看得到</span></div></div>
    <div class="glist" id="glist"></div></div></div>`;
  renderPickerList();
  const inp=$("#gq"); if(inp){ inp.oninput=()=>renderPickerList(); try{inp.focus();}catch(e){} }
}
function renderPickerList(){
  const box=$("#glist"); if(!box||!modal||modal.t!=="picker") return;
  const s=state.seats[modal.seat], q=($("#gq")&&$("#gq").value.trim())||"";
  const pool=(s.offers&&s.offers.length)?s.offers.map(id=>CHAR[id]).filter(Boolean):DATA.characters.filter(c=>state.pack==="all"||c.pack==="base");
  const list=RoomClient.searchList(pool,q);
  box.innerHTML=list.map(c=>{ const tk=takenBy(c.id,modal.seat);
    return `<div class="grow-item${tk?" taken":""}" data-a="pickItem" data-c="${c.id}">${avaHtml(c)}
      <div class="grow"><div class="gn">${esc(c.name)}${c.hidden?' <span class="badge hid">隐藏</span>':""}${s.charId===c.id?' <span class="badge me">当前</span>':""}</div>
      <div class="gmeta">${tk?`<b style="color:var(--stamp)">${tk} 号已公开选用</b> · `:""}${charMeta(c)} · ${c.skills.map(k=>esc(k.name)).join("/")}</div></div>
      <button class="gv" data-a="preview" data-c="${c.id}">查看技能</button></div>`; }).join("")
    ||`<div class="hint" style="padding:12px">没找到「${esc(q)}」</div>`;
}
// 预览(叠在选角列表上):看技能 → 选定。隐藏角色给两个选定按钮:暗置(默认)/ 公开
function previewChar(id){
  const c=CHAR[id]; if(!c||!modal||modal.t!=="picker") return;
  const seat=modal.seat, tk=takenBy(id,seat);
  const old=$("#pv"); if(old) old.remove();
  const ov=document.createElement("div"); ov.className="mask"; ov.id="pv"; ov.style.zIndex="90";
  ov.innerHTML=`<div class="sheet"><h2>查看技能<span class="x" data-a="pvclose">×</span></h2>
    <div class="herohead">${avaHtml(c,true)}<div><div class="hn">${esc(c.name)}</div><div class="hmeta">${charMeta(c)}</div></div></div>
    ${skillsHtml(c)}
    ${tk?`<div class="hint" style="color:var(--stamp)">${tk} 号已公开选用这名角色,不能重复选。</div>`:""}
    ${c.hidden?`<div class="facechoice"><button class="primary" data-a="pickFace" data-c="${id}" data-up="0"${tk?" disabled":""}>暗置选定<small>面朝下,只有你知道;发动技能时再翻开</small></button>
        <button data-a="pickFace" data-c="${id}" data-up="1"${tk?" disabled":""}>公开选定<small>直接翻开,全场可见</small></button></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="ghost" data-a="pvclose">返回列表</button></div>`
    :`<div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px"><button class="ghost" data-a="pvclose">返回列表</button><button class="primary" data-a="pickFace" data-c="${id}" data-up="1"${tk?" disabled":""}>选定此角色</button></div>`}
  </div>`;
  $("#modal").appendChild(ov);
}
function pickChar(id,up){
  const seat=modal&&modal.seat; if(seat==null) return;
  const s=state.seats[seat];
  if(s.charId!=null&&s.charId!==id&&!confirm("更换角色?")) return;
  act("pickChar",{seatNo:seat,charId:id,faceUp:up});
  if(CHAR[id].hidden&&!up) toast("已暗置「"+CHAR[id].name+"」:只有你看得到,发动技能时点「翻开角色」");
  closeModal();
}
// 座位「查看技能」:公开角色 / 自己的暗置角色 / 已翻开的隐藏角色
function openSkillView(seatNo){
  const s=state.seats[seatNo], c=s&&CHAR[s.charId]; if(!c){closeModal();return;}
  const mine=state.youHold.includes(seatNo);
  modal={t:"skill",seat:seatNo};
  $("#modal").innerHTML=`<div class="mask" data-mclose="1"><div class="sheet"><h2>角色技能<span class="x" data-a="close">×</span></h2>
    <div class="herohead">${avaHtml(c,true)}<div><div class="hn">${esc(c.name)}</div><div class="hmeta">${charMeta(c)} · 座位 ${seatNo}${mine?"(你)":""}</div>
      ${c.hidden?`<div class="hmeta">${s.faceUp?"已翻开 · 全场可见":"暗置中 · 只有你看得到"}</div>`:""}</div></div>

      :`<button class="danger" style="width:100%;padding:11px" data-a="flip" data-s="${seatNo}" data-up="1">发动技能 · 翻开角色</button>`):""}

function openCharView(id){

/* ============ 渲染 ============ */
function render(){
  const app=$("#app");
  let h='<h1>风声<span class="st">绝密</span></h1><div class="sub">谍战桌游典藏版 · 线下房间</div>';
  if(!state){
    app.innerHTML=h+RoomClient.connectFormHtml(RC,{title:"加入房间",hint:"同一房间码即进同一桌。桌上照常用实体牌,手机负责身份保密、情报台账与胜负判定。"})
      +'<div class="hint" style="text-align:center">玩三国杀?<a href="/">去三国杀线下房间 →</a></div>';
    RoomClient.bindConnectForm(RC); return;
  }
  if(!DATA){ app.innerHTML=h+'<div class="card">加载角色数据…</div>'; return; }
  h+=viewHeader();
  if(state.phase==="over") h+=viewResult();
  h+=viewMine();
  if(state.phase==="setup") h+=viewSetup();
  if(state.phase==="play") h+=viewTurn();
  h+=viewSeats();
  h+=viewRef();
  h+=viewLog();
  h+=viewAdmin();
  h+='<footer>风声 · 线下房间原型 · 以实体卡牌文本为准</footer>';
  // 整页重绘会收起 <details>、打断正在填的输入框:记下展开项与输入值,重绘后恢复
  const openK=[...document.querySelectorAll("details[data-k]")].filter(d=>d.open).map(d=>d.dataset.k);
  const focusId=document.activeElement&&document.activeElement.id, vals={};
  document.querySelectorAll("#app input[id],#app select[id]").forEach(el=>{ if(el.dataset.dirty) vals[el.id]=el.value; });
  app.innerHTML=h;
  openK.forEach(k=>{const d=document.querySelector(`details[data-k="${k}"]`); if(d) d.open=true;});
  for(const [id,v] of Object.entries(vals)){ const el=document.getElementById(id); if(el){el.value=v;el.dataset.dirty="1";} }
  if(focusId&&document.getElementById(focusId)) document.getElementById(focusId).focus();
  rerenderModal();
}

function viewHeader(){
  return `<div class="card"><div class="row"><span class="grow">房间 <b>${esc(RC.code||state.roomCode)}</b></span>
    <button class="chip" data-a="rename" style="border:none;cursor:pointer">我 ${esc(RC.deviceId)} ✎</button>
    <span class="chip">座位 [${state.youHold.join(",")||"未入座"}]</span>
    <button class="ghost sm" data-a="newroom">新开房间</button></div></div>`;
}

function viewResult(){
  const r=state.result||{winners:[]};
  let h=`<div class="card result"><div class="big">本局结束</div><div style="text-align:center;margin:4px 0 8px">${esc(r.reason||"")}</div>`;
  h+=`<div style="text-align:center;margin-bottom:8px">胜者:<b>${(r.winners||[]).map(n=>n+"号").join("、")||"无"}</b></div>`;
  h+=seatsArr().map(s=>`<div class="row" style="padding:3px 0"><b style="width:36px">${s.seatNo}号</b><span class="grow">${s.charId!=null&&CHAR[s.charId]?esc(CHAR[s.charId].name):"—"}</span>${idHtml(s.identity)}${(r.winners||[]).includes(s.seatNo)?' <span class="badge turn">胜</span>':""}</div>`).join("");
  h+=`<div class="row" style="margin-top:10px"><button class="primary grow" data-a="newGame">再来一局(保留座位)</button></div></div>`;
  return h;
}

// 我的机密:身份 / 神秘人任务 / 角色(隐藏角色只有自己看得到)/ 选角候选 / 宣胜
function viewMine(){
  const mine=mineSeats();
  if(!mine.length) return `<div class="card secret"><h2>我的机密</h2><div class="hint">先在下方「座位」里认领你坐的位置,身份和角色只会显示在你自己的手机上。</div></div>`;
  return mine.map(s=>{
    let h=`<div class="card secret"><h2>我的机密<span class="tag">${s.seatNo} 号座位 · 仅你可见</span></h2>`;
    // 身份
    if(s.identity){
      h+=`<div class="dossier"><span>身份</span>${facHtml(s.identity.faction)}<span class="hint" style="margin:0">${esc(DATA.factions[s.identity.faction].goal)}</span></div>`;
      if(s.identity.task&&TASK[s.identity.task]) h+=`<div class="task"><b>秘密任务 · ${esc(TASK[s.identity.task].name)}</b><br>${esc(TASK[s.identity.task].text)}</div>`;
    } else h+=`<div class="hint" style="margin-top:0">还没有身份 —— 等系统发身份,或用实体身份牌在下面登记。</div>`;
    // 角色(选角 / 查技能 / 暗置翻开都在「座位」区;这里只做摘要)
    if(s.charId!=null&&CHAR[s.charId]){
      const c=CHAR[s.charId];
      h+=`<div class="row" style="margin-top:10px"><span class="grow">角色 <b style="font-family:var(--display)">${esc(c.name)}</b> <span class="hint">${esc(c.title)}</span>`
        +(c.hidden?(s.faceUp?' <span class="badge hid">已翻开</span>':' <span class="badge hid">暗置 · 他人看不到</span>'):"")+`</span>`
        +`<button class="btn-skill" data-a="skill" data-s="${s.seatNo}">查看技能</button>`
        +(c.hidden&&state.phase!=="over"?(s.faceUp?`<button class="ghost sm" data-a="flip" data-s="${s.seatNo}" data-up="0">翻回暗置</button>`
          :`<button class="danger sm" data-a="flip" data-s="${s.seatNo}" data-up="1">发动技能 · 翻开</button>`):"")+`</div>`;
    } else if(s.offers&&s.offers.length){
      h+=`<div class="row" style="margin-top:10px"><span class="grow">发给你 ${s.offers.length} 张角色候选</span><button class="primary sm" data-a="picker" data-s="${s.seatNo}">去选角色 ▾</button></div>`;
    } else if(state.phase!=="over"){
      h+=`<div class="row" style="margin-top:10px"><span class="grow hint" style="margin:0">还没选角色(可等「发角色」,或用实体牌选好后搜索登记)</span>
        <button class="sm" data-a="picker" data-s="${s.seatNo}">选角色 ▾</button></div>`;
    }
    // 宣胜
    if(state.phase==="play"&&!s.dead){
      if(s.canWin) h+=`<button class="danger winbtn" data-a="declare" data-s="${s.seatNo}">宣 胜</button><div class="hint" style="text-align:center">你已达成胜利条件(只有你看得到这个提示)</div>`;
      else h+=`<div class="row" style="margin-top:10px"><span class="grow hint" style="margin:0">队友集齐情报时也可以宣胜,系统会校验。</span><button class="sm" data-a="declare" data-s="${s.seatNo}">宣胜</button></div>`;
    }
    // 手动登记身份(实体身份牌 / 顾小梦承志换身份)
    if(state.phase!=="over"){
      h+=`<details data-k="id${s.seatNo}" style="margin-top:10px"><summary>用实体身份牌 / 技能换身份?手动登记</summary><div class="row" style="margin-top:6px">
        <select id="idf-${s.seatNo}" class="grow" style="width:auto"><option value="">(清空)</option>${["red","blue","green"].map(f=>`<option value="${f}"${s.identity&&s.identity.faction===f?" selected":""}>${FNAME[f]}</option>`).join("")}</select>
        <select id="idt-${s.seatNo}" class="grow" style="width:auto">${DATA.tasks.filter(t=>state.pack==="all"||t.pack==="base").map(t=>`<option value="${t.key}"${s.identity&&s.identity.task===t.key?" selected":""}>${esc(t.name)}</option>`).join("")}</select>
        <button class="sm" data-a="setId" data-s="${s.seatNo}">登记</button></div><div class="hint">任务只在选「神秘人」时生效。登记内容只有你看得到,日志里不会写。</div></details>`;
    }
    return h+`</div>`;
  }).join("");
}

  h+=`<div style="margin-top:12px"><b>② 发身份</b> <span class="hint">${n} 人 · 配比合计 ${sum}${sum!==n?' <b style="color:var(--stamp)">≠ 座位数</b>':""}</span></div>

function viewSeats(){
  const N=Object.keys(state.seats).length;
  let h=`<div class="card"><h2>座位<span class="tag">点认领入座 · 可代持没电的座位</span></h2>`;
  h+=`<div class="row" style="margin-bottom:8px"><span class="hint" style="margin:0">共 <b>${N}</b> 座</span>
    <button class="ghost sm" data-a="seatMinus"${N<=3?" disabled":""}>− 减座位</button><button class="ghost sm" data-a="seatPlus"${N>=9?" disabled":""}>＋ 加座位</button>
    <span class="grow"></span><span class="hint" style="margin:0">3–9,从末位增减</span></div>`;
  for(const s of seatsArr()){
    const mine=state.youHold.includes(s.seatNo), turn=state.phase==="play"&&state.turn===s.seatNo;
    const heldByOther=s.holderDevices.length&&!mine;
    h+=`<div class="seat${mine?" mine":""}${turn?" turn":""}${s.dead?" dead":""}"><div class="row"><span class="st grow">座位 ${s.seatNo}${charLabel(s)}`
      +(mine?'<span class="badge me">我</span>':"")+(turn?'<span class="badge turn">回合中</span>':"")+(s.dying?'<span class="badge dying">濒死</span>':"")+(s.dead?'<span class="badge dead">阵亡</span>':"")
      +(s.identity&&!mine?" "+idHtml(s.identity):"")+`</span>`;
    if(s.charId!=null) h+=`<button class="btn-skill" data-a="skill" data-s="${s.seatNo}">查看技能</button>`;
    if(mine) h+=`<button class="ghost sm" data-a="release" data-s="${s.seatNo}">释放</button>`;
    else if(heldByOther) h+=`<button class="sm" data-a="takeover" data-s="${s.seatNo}" style="border-color:var(--stamp);color:var(--stamp)">替换</button>`;
    else h+=`<button class="sm" data-a="claim" data-s="${s.seatNo}">认领</button>`;
    h+=`</div>`;
    if(mine){
      const c=s.charId!=null?CHAR[s.charId]:null;
      h+=`<div class="sub2"><span class="lbl">角色</span>`;
      if(s.offers&&s.offers.length) h+=`<button class="primary sm" data-a="picker" data-s="${s.seatNo}">从 ${s.offers.length} 张候选里选 ▾</button>`;
      else h+=`<button class="sm" data-a="picker" data-s="${s.seatNo}"${state.phase==="over"?" disabled":""}>${c?esc(c.name)+" ▾":"选角色 ▾"}</button>`;
      if(c&&c.hidden&&state.phase!=="over") h+=s.faceUp?`<button class="ghost sm" data-a="flip" data-s="${s.seatNo}" data-up="0">翻回暗置</button>`
        :`<button class="danger sm" data-a="flip" data-s="${s.seatNo}" data-up="1">发动技能 · 翻开</button>`;
      h+=`</div>`;
    } else if(s.offerCount) h+=`<div class="who" style="margin-top:3px">选角中…</div>`;
    // 情报区(公开台账)
    h+=`<div class="sub2" data-a="intel" data-s="${s.seatNo}" style="cursor:pointer"><span class="lbl">情报</span>${s.intel.map(intelHtml).join("")||'<span class="lbl">无</span>'}${s.intel.length?" "+cntHtml(s.counts):""}
      <span class="grow"></span>${state.phase!=="over"?'<button class="ghost sm" data-a="intel" data-s="'+s.seatNo+'">登记 / 生死 ▸</button>':""}</div>`;
    if(heldByOther) h+=`<div class="hint">当前由 <b>${esc(s.holderDevices[0])}</b> 持有 · 若其断线,点「替换」即可接管</div>`;
    h+=`</div>`;
  }
  return h+`</div>`;
}

/* ============ 情报 / 生死弹层(公开台账,任何人可改)============ */
function openIntelSheet(seatNo){
  const s=state&&state.seats[seatNo]; if(!s){closeModal();return;}
  modal={t:"intel",seat:seatNo};
  let h=`<div class="mask" data-mclose="1"><div class="sheet"><h2>座位 ${seatNo}${charLabel(s)}<span class="x" data-a="close">×</span></h2>`;
  if(s.identity&&!state.youHold.includes(seatNo)) h+=`<div style="margin-bottom:8px">身份 ${idHtml(s.identity)}</div>`;
  if(state.phase!=="over"&&!s.dead){
    h+=`<div><b>获得情报</b> <span class="hint">点颜色即登记</span></div><div class="kinds" style="margin-top:6px">`
      +DATA.intelKinds.map(k=>`<button class="${k.key}" data-a="addIntel" data-s="${seatNo}" data-k="${k.key}">${k.label}</button>`).join("")+`</div>`;
  }
  h+=`<div style="margin-top:12px"><b>情报区</b> ${cntHtml(s.counts)} <span class="hint">${state.phase!=="over"?"点一张移除(澄清/烧毁/被拿走)":""}</span></div>
    <div class="ilist" style="margin-top:6px">${s.intel.map(it=>`<span class="intel ${it.kind}" data-a="rmIntel" data-s="${seatNo}" data-i="${it.id}"></span>`).join("")||'<span class="hint">无</span>'}</div>`;
  if(state.phase!=="over"){
    h+=`<div class="row" style="margin-top:12px">`;
    if(s.dead) h+=`<button class="ghost" data-a="revive" data-s="${seatNo}">撤销死亡</button>`;
    else h+=`<button class="${s.dying?"danger":"ghost"}" data-a="death" data-s="${seatNo}">${s.dying?"无人救 · 确认死亡":"确认死亡"}</button>`;
    if(state.phase==="play"&&state.turn!==seatNo&&!s.dead) h+=`<button class="ghost" data-a="setTurn" data-s="${seatNo}">设为当前回合</button>`;
    if(s.hasChar&&!state.youHold.includes(seatNo)) h+=`<button class="ghost" data-a="flip" data-s="${seatNo}" data-up="${s.faceUp?0:1}">${s.faceUp?"角色翻至面朝下":"翻开其角色(技能效果)"}</button>`;
    h+=`</div>`;
    if(s.dying) h+=`<div class="hint">濒死:可用【澄清】移除一张黑色情报救回;无人救就确认死亡(身份会公开)。</div>`;
  }
  $("#modal").innerHTML=h+`</div></div>`;
}

/* ============ 事件(委托)============ */
document.addEventListener("click",e=>{
  const m=e.target.closest("[data-mclose]"); if(m&&e.target===m){closeModal();return;}
  const pv=$("#pv"); if(pv&&e.target===pv){pv.remove();return;} // 点预览背景:只关预览,列表还在
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, sn=b.dataset.s!=null?+b.dataset.s:null;
  switch(a){
    case "rename": RC.promptRename(); break;
    case "newroom": { const c=RoomClient.randomCode(); if(confirm("离开当前房间、新开一局(房间号 "+c+")?\n记得把新房间号告诉其他玩家。")) RC.connect(RC.base||RoomClient.defaultBase(),c); break; }
    case "intel": e.stopPropagation(); openIntelSheet(sn); break;
    case "skill": openSkillView(sn); break;
    case "picker": openPicker(sn); break;
    case "pickItem": { const c=+b.dataset.c; if(CHAR[c].hidden) previewChar(c); else if(takenBy(c,modal.seat)) toast("该角色已被公开选用"); else pickChar(c,true); break; }
    case "preview": e.stopPropagation(); previewChar(+b.dataset.c); break;
    case "pvclose": { const pv=$("#pv"); if(pv) pv.remove(); break; }
    case "pickFace": pickChar(+b.dataset.c,b.dataset.up==="1"); break;
    case "clearChar": if(confirm("清除已选角色?")){ act("clearChar",{seatNo:sn}); closeModal(); } break;
    case "close": closeModal(); break;
    case "claim": RC.send({type:"claimSeat",seatNo:sn}); break;
    case "release": if(confirm("释放这个座位?")) RC.send({type:"releaseSeat",seatNo:sn}); break;
    case "takeover": if(confirm("强制接管这个座位?原持有设备会被撤下(用于朋友手机没电)。")) RC.send({type:"takeoverSeat",seatNo:sn}); break;
    case "seatPlus": RC.send({type:"addSeat"}); break;
    case "seatMinus": { const last=seatsArr().slice(-1)[0]; if(last&&last.holderDevices.length&&!confirm(last.seatNo+" 号有人坐,确定删掉这个座位?")) break; RC.send({type:"removeSeat"}); break; }
    case "disband": if(confirm("解散房间?所有人退出,不可恢复。")) RC.send({type:"disbandRoom"}); break;
    case "pack": act("setPack",{pack:b.dataset.p}); break;
    case "dealChars": if(!seatsArr().some(s=>s.hasChar||s.offerCount)||confirm("重新发角色会清掉所有人已选的角色,继续?")) act("dealChars",{per:2}); break;
    case "setCounts": act("setIdCounts",{red:+$("#ic-red").value,blue:+$("#ic-blue").value,green:+$("#ic-green").value}); break;
    case "dealIds": if(!seatsArr().some(s=>s.hasIdentity)||confirm("重新发身份会覆盖所有人的身份,继续?")) act("dealIdentities"); break;
    case "start": act("startGame",{first:+$("#first").value}); break;
    case "flip": act("flipChar",{seatNo:sn,faceUp:b.dataset.up==="1"}); break;
    case "setId": { const f=$("#idf-"+sn).value; act("setIdentity",{seatNo:sn,faction:f||null,task:f==="green"?$("#idt-"+sn).value:undefined}); break; }
    case "declare": if(confirm("确认宣胜?系统会校验,成功则本局结束并公开所有身份。")) act("declareWin",{seatNo:sn}); break;
    case "nextTurn": act("nextTurn"); break;
    case "setTurn": act("setTurn",{seatNo:sn}); break;
    case "addIntel": act("addIntel",{seatNo:sn,kind:b.dataset.k}); break;
    case "rmIntel": act("removeIntel",{seatNo:sn,intelId:+b.dataset.i}); break;
    case "death": if(confirm(sn+" 号确认死亡?其身份将公开。")) act("confirmDeath",{seatNo:sn}); break;
    case "revive": act("revive",{seatNo:sn}); break;
    case "newGame": if(confirm("再来一局?清空角色、身份和情报,保留座位。")) act("newGame"); break;
    case "forceEnd": { const w=prompt("手动结算(技能特殊胜利/规则争议):输入胜者座位号,用逗号分隔,如 2,5"); if(w==null) break;
      const winners=w.split(/[,，\s]+/).map(Number).filter(Boolean); const note=prompt("备注(可空),如:秦圆圆比翼双飞")||"";
      act("forceEnd",{winners,note}); break; }
    case "viewChar": openCharView(+b.dataset.c); break;
  }
});
document.addEventListener("input",e=>{ if(e.target.id) e.target.dataset.dirty="1"; }); // 用户改过的输入框,重绘时保留
document.getElementById("rcNow").onclick=()=>RC.reconnectNow();
render();
</script>
</body>
</html>
