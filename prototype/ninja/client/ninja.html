<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>忍者之夜房间</title>
<style>
/* 夜色水墨:墨蓝夜空 + 和纸卡 + 朱印 */
:root{
  --bg:#141a2b; --bg2:#1c2439; --card:rgba(30,38,60,.92); --paper:#f4ecd8; --line:rgba(244,236,216,.16);
  --fg:#ece6d6; --fg-soft:#a7a496; --ink:#2a2420; --red:#c7343f; --blue:#3b74c4; --purple:#7b4ea3; --gold:#d9a441; --green:#4fa36b; --warn:#e0574f;
  --body:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:radial-gradient(circle at 80% -10%,rgba(217,164,65,.18),transparent 38%),radial-gradient(circle at 5% 100%,rgba(123,78,163,.25),transparent 45%);
  color:var(--fg);font-family:var(--body);line-height:1.6;padding:12px 16px 60px;max-width:560px;margin:0 auto}
h1{font-weight:900;font-size:24px;letter-spacing:.3em;text-align:center;margin:4px 0 0;color:var(--paper)}
h1 .st{display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--red);border:2px solid var(--red);border-radius:4px;padding:0 5px;margin-left:6px;transform:rotate(-8deg);vertical-align:middle;font-weight:700}
.sub{text-align:center;color:var(--fg-soft);font-size:12px;letter-spacing:.14em;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--purple);border-radius:10px;padding:12px 14px;margin-bottom:11px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.card.secret{border-left-color:var(--gold)}
.card.act{border-left-color:var(--red);box-shadow:0 0 0 2px rgba(199,52,63,.35),0 6px 20px rgba(0,0,0,.3)}
.card h2{font-weight:900;font-size:16px;letter-spacing:.08em;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:10px;color:var(--paper)}
.card h2 .tag{float:right;font-size:11px;color:var(--fg-soft);letter-spacing:0;font-weight:400}
label{font-size:13px;color:var(--fg-soft)}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#0f1424;color:var(--fg);width:100%}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:#2a3350;color:var(--fg);cursor:pointer;font-weight:600}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button.ok{background:var(--green);border-color:var(--green);color:#fff}
button.ghost{background:transparent;color:var(--fg-soft)}
button.sm{font-size:12px;padding:4px 9px}
button.xs{font-size:12px;padding:2px 7px;line-height:1.4}
button.on{background:var(--gold);border-color:var(--gold);color:#1a1408}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--fg-soft);margin-top:6px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--fg-soft);background:rgba(0,0,0,.2)}
.chip.red{border-color:var(--red);color:#ff8d94}.chip.blue{border-color:var(--blue);color:#8db6ef}.chip.purple{border-color:var(--purple);color:#c9a6e6}.chip.gold{border-color:var(--gold);color:var(--gold)}
a{color:#8db6ef}
#connbar{display:none;position:fixed;left:0;right:0;top:0;z-index:9999;align-items:center;justify-content:center;gap:12px;padding:9px 14px;background:var(--warn);color:#fff;font-size:13px;font-weight:600}
#connbar button{background:#fff;color:var(--warn);border:none;padding:5px 14px;font-weight:700}
body.disconnected #connbar{display:flex}
body.disconnected #app{opacity:.5;pointer-events:none;filter:grayscale(.35)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#f4ecd8;color:#1a1408;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:10000;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.topbar{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.topbar .who{font-size:12px;color:var(--fg-soft)}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}

/* 座位(准备页) */
.seats-setup .seat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:rgba(0,0,0,.18);display:flex;align-items:center;gap:8px}
.seats-setup .seat.mine{border-color:var(--gold);background:rgba(217,164,65,.08)}
.seats-setup .st{font-weight:900;font-size:16px}
.seats-setup .who{font-size:12px;color:var(--fg-soft)}
.cgrid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.cfg label{display:block}.cfg input{margin-top:3px}

/* 忍者牌:阶段色块 + 图标 + 编号 */
.cd{position:relative;width:64px;height:90px;border-radius:7px;border:2px solid rgba(0,0,0,.35);background:var(--paper);overflow:hidden;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);transition:transform .12s}
.cd .top{position:absolute;inset:0 0 34% 0;background:var(--c,#555);display:flex;align-items:center;justify-content:center;font-size:26px}
.cd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.cd.hasimg .top{display:none}
.cd.hasimg .cn{background:linear-gradient(transparent,rgba(10,12,24,.85) 35%);color:#f4ecd8;height:40%;align-items:flex-end;padding-bottom:9px}
.cd.hasimg .ph{color:rgba(244,236,216,.6)}
.cd .num{z-index:2}.cd .bd{z-index:2}.cd .cn{z-index:1}
.cd .num{position:absolute;top:3px;right:4px;background:rgba(0,0,0,.55);color:#fff;font-weight:900;font-size:13px;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center}
.cd .cn{position:absolute;bottom:0;left:0;right:0;height:34%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;line-height:1.1;text-align:center;padding:0 2px}
.cd .ph{position:absolute;bottom:1px;left:0;right:0;font-size:8px;color:#8a7a5a;text-align:center;letter-spacing:.05em}
.cd.big{width:92px;height:130px}.cd.big .top{font-size:38px}.cd.big .cn{font-size:13px}.cd.big .num{width:24px;height:24px;line-height:24px;font-size:15px}
.cd.mini{width:36px;height:50px;border-radius:4px;cursor:default;border-width:1px}.cd.mini .top{font-size:14px}.cd.mini .cn{font-size:7px}.cd.mini .num{width:13px;height:13px;line-height:13px;font-size:9px;top:1px;right:2px}.cd.mini .ph{display:none}
.cd.back{background:repeating-linear-gradient(135deg,#2b2f4a 0 5px,#20243a 5px 10px);border-color:#0d1020;cursor:default;color:rgba(255,255,255,.65);font-size:20px}
.cd.back.mini{font-size:12px}
.cd.sel{outline:3px solid var(--gold);outline-offset:1px;transform:translateY(-4px)}
.cd.dim{opacity:.38;filter:grayscale(.6)}
.cd.clickable:hover{transform:translateY(-3px)}
.cd .bd{position:absolute;top:3px;left:3px;font-size:9px;background:rgba(0,0,0,.6);color:#fff;border-radius:3px;padding:0 3px}
.hand{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:20px}
/* 流派牌 */
.hs{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 10px;font-weight:900;color:#fff;background:#555;font-size:14px;letter-spacing:.05em}
.hs.crane{background:var(--red)}.hs.lotus{background:var(--blue)}.hs.ronin{background:var(--purple)}.hs.unknown{background:#3a3f55;color:var(--fg-soft)}
.hs.big{font-size:22px;padding:12px 22px;border-radius:12px}
.hcard{position:relative;width:120px;height:170px;border-radius:9px;overflow:hidden;border:2px solid rgba(0,0,0,.4);box-shadow:0 3px 10px rgba(0,0,0,.45);flex:none;background:#3a3f55}
.hcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hcard .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 6px;text-align:center;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(transparent,rgba(10,12,24,.9) 40%)}
.hcard.crane .nm b{color:#ff8d94}.hcard.lotus .nm b{color:#8db6ef}.hcard.ronin .nm b{color:#c9a6e6}
.hcard.unknown{display:flex;align-items:center;justify-content:center;color:var(--fg-soft);font-size:13px;text-align:center;padding:8px}
.hs small{font-weight:400;font-size:11px;opacity:.85}

/* 计分 / 阶段条 */
.score{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.score .sc{border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;background:rgba(0,0,0,.25);display:flex;gap:5px;align-items:center}
.score .sc.dead{opacity:.55;text-decoration:line-through}
.score .sc b{font-size:14px}
.score .stars{color:var(--gold);letter-spacing:1px}
.phases{display:flex;gap:3px;justify-content:center;margin:6px 0 8px;flex-wrap:wrap}
.phases .pp{font-size:11px;padding:3px 8px;border-radius:14px;border:1px solid var(--line);color:var(--fg-soft);background:rgba(0,0,0,.2)}
.phases .pp.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:800}
.phases .pp.done{opacity:.5}
.status{text-align:center;font-weight:800;color:var(--paper);font-size:15px;margin:4px 0 8px}
.status small{display:block;font-weight:400;color:var(--fg-soft);font-size:12px}
.queue{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;margin:4px 0}
.queue .qi{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--fg-soft);gap:2px}
.queue .qi.cur .cd{outline:3px solid var(--red)}
.queue .qi.done{opacity:.45}
.queue .qi.void .cd{filter:grayscale(1)}

/* 玩家面板 */
.pl{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;background:rgba(0,0,0,.18);display:flex;gap:10px;align-items:flex-start}
.pl.act{border-color:var(--red);box-shadow:0 0 0 2px rgba(199,52,63,.3)}
.pl.mine{background:rgba(217,164,65,.07)}
.pl.dead{opacity:.6}
.pl .ph{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.pl .ph .no{font-weight:900;font-size:17px;color:var(--paper)}
.pl .ph .nm{font-weight:600}
.pl .ph .bd{font-size:11px;border-radius:10px;padding:0 7px;border:1px solid var(--line);color:var(--fg-soft)}
.pl .ph .bd.on{border-color:var(--red);color:#ff8d94}.pl .ph .bd.ok{border-color:var(--green);color:#8fd3a5}.pl .ph .bd.dead{border-color:var(--warn);color:var(--warn)}
.pl .lb{font-size:11px;color:var(--fg-soft);margin-top:4px}
.pl .hd{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
.pl .stars{color:var(--gold);font-size:13px}

/* 面板 */
.panel{border:1px solid rgba(217,164,65,.5);border-radius:10px;padding:10px 12px;background:rgba(217,164,65,.07);margin-bottom:8px}
.panel .ti{font-weight:800;font-size:15px;color:var(--gold);margin-bottom:4px}
.panel .tp{font-size:13px}
.tgt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tgt button{min-width:64px}
.note{border-left:3px solid var(--gold);padding:4px 10px;margin:5px 0;background:rgba(0,0,0,.2);border-radius:0 6px 6px 0;font-size:13px}
.result{border-left-color:var(--gold);background:rgba(217,164,65,.08)}
.result .big{font-weight:900;font-size:21px;text-align:center;letter-spacing:.12em;margin-bottom:6px;color:var(--paper)}
.vt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.vt td,.vt th{padding:4px 6px;border-bottom:1px dotted var(--line);vertical-align:middle;text-align:left}
.vt th{font-size:11px;color:var(--fg-soft);font-weight:400}
.vt tr.win td{background:rgba(217,164,65,.14);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(5,8,18,.8);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:34px 10px;overflow:auto}
.sheet{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:11px;width:100%;max-width:520px;padding:14px 15px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.sheet h2{font-weight:900;font-size:17px;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--paper)}
.sheet h2 .x{margin-left:auto;font-size:20px;line-height:1;color:var(--fg-soft);cursor:pointer;padding:0 4px}
.codex .ce{display:flex;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line);align-items:flex-start}
.codex .ce .cn{font-weight:800;font-size:15px;color:var(--paper)}
.codex .ce .cm{font-size:11px;color:var(--fg-soft)}
.codex .ce .cdsc{font-size:13px;margin-top:2px}
.codex .ce .en{font-size:11px;color:var(--fg-soft);font-style:italic;margin-top:2px}
.codex h3{font-size:13px;letter-spacing:.15em;color:var(--fg-soft);margin:10px 0 2px}
.codex .rule{font-size:13px;margin:3px 0}
.log{font-size:12px;color:var(--fg-soft);max-height:220px;overflow:auto;font-family:var(--mono)}
.log div{padding:2px 0;border-bottom:1px dotted var(--line)}
details summary{cursor:pointer;font-size:13px;color:var(--fg-soft)}
footer{text-align:center;font-size:11px;color:var(--fg-soft);margin-top:18px;letter-spacing:.1em}
.tk{display:inline-block;min-width:30px;text-align:center;border-radius:14px;padding:1px 8px;font-size:12px;font-weight:800;background:#2a3350;border:1px solid var(--line);cursor:pointer}
.tk.on{background:var(--gold);color:#1a1408;border-color:var(--gold)}
</style>
</head>
<body>
<div id="connbar"><span>⚠ 连接已断开,正在重连…操作已暂停</span><button id="rcNow" type="button">立即重连</button></div>
<div id="app"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script src="/common/room-client.js"></script><!-- 公共房间客户端(连接/重连/改名/toast);见 prototype/common/client/ -->
<script>
/* 忍者之夜房间:系统暗发流派牌、手机上轮抽忍者牌;夜晚五阶段每人先声明出哪几张(或跳过),收齐统一翻开按编号结算;
   击杀弹反应窗(镜僧/殉道者);揭示比级发荣誉标记(面值只有自己看得到)。权威逻辑在 DO(prototype/ninja/shared/ninja-logic.mjs);这里只渲染 roomState、发 action{op,…}。没有定时器。 */
const {esc,toast,$}=RoomClient;
let state=null, DATA=null, C={}, PH={};
let actSeat=null;                 // 多座位代持时当前操作的座位
let pickSel=null;                 // 轮抽:选中的牌 id
let declSel=[];                   // 声明:选中的牌 id 列表
let tgtSel=null, tgt2=[], lookSel=null, giveSel=null, takeSel=null, offerSel=null; // 结算面板的选择
let modal=null;

const RC=RoomClient.create({
  wsPath: code=>"/api/ninja/"+code+"/ws",
  errorText:{NOT_SETUP:"对局已开始,不能改设置/座位",BAD_CONFIG:"配置不合法",PLAYER_COUNT:"人数要在 4~11 之间",NOT_DRAFT:"现在不是轮抽阶段",NOT_IN_HAND:"这张牌不在手里",
    NOT_DECLARE:"现在不是声明阶段",DEAD:"已死亡的座位不能出牌",BAD_CARDS:"只能声明本阶段、未作废的牌",NOT_RESOLVE:"现在没有轮到你结算",NOT_YOUR_CARD:"不是你的牌",BAD_TARGET:"目标不合法",
    BAD_PICK:"要从翻出的牌里挑",BAD_LOOK:"先选看标记还是看流派牌",BAD_SWAP:"交换要各选一枚",NOT_REACT:"现在没有反应窗",NOT_ROUND_END:"本轮还没结束",BAD_CARD:"未知的牌"},
  beforeConnect(){ state=null; closeModal(); resetSel(); },
  onState(m){ const prev=state; state=m; afterState(prev); autoSeat(); render(); },
  onMessage(){},
  onClosed(){ state=null; closeModal(); render(); },
  onRenamed(){ render(); },
});
function act(op,extra){ return RC.send(Object.assign({type:"action",op},extra||{})); }
function resetSel(){ pickSel=null; declSel=[]; tgtSel=null; tgt2=[]; lookSel=null; giveSel=null; takeSel=null; offerSel=null; }

fetch("/ninja/data.json?v=__NINJA_DATA_VER__").then(r=>r.json()).then(d=>{ DATA=d; C=Object.fromEntries(d.cards.map(c=>[c.key,c])); PH=Object.fromEntries(d.phases.map(p=>[p.key,p])); render(); }).catch(()=>toast("卡牌数据加载失败,刷新重试"));

/* ============ 小工具 ============ */
const seatsArr=()=>Object.values(state.seats).sort((a,b)=>a.seatNo-b.seatNo);
const mySeats=()=>state.youHold.slice().sort((a,b)=>a-b);
const nameOf=s=>s.holderDevices[0]||"";
const hfam=h=>h==="ronin"?"ronin":h.split(":")[0];
const hrank=h=>h==="ronin"?null:+h.split(":")[1];
// 牌名版本(房规 config.names):流派名 / 牌名 / 阶段名都从这一套取
const NS=()=>DATA.nameSets[(state&&state.config&&state.config.names)||DATA.defaultNames]||DATA.nameSets[DATA.defaultNames];
const famName=f=>NS().houses[f]||f;
const hname=h=>!h?"?":h==="ronin"?famName("ronin"):(famName(hfam(h))+" "+hrank(h));
const cbase=k=>NS().cards[k]||(C[k]?C[k].name:k);
const cname=c=>{ const d=C[c.key]; return d?(c.num!=null&&d.num==null?cbase(c.key)+" "+c.num:cbase(c.key)):c.key; };
const stars=n=>n?"★".repeat(n):"☆";
const phaseName=k=>k==="trickster"?"骗徒":k==="react"?"反应":k==="reveal"?"揭示":PH[k]?cbase(k):k;
function cardHtml(c,opt){
  opt=opt||{}; const d=C[c.key]||{};
  const cls="cd"+(opt.big?" big":"")+(opt.mini?" mini":"")+(opt.sel?" sel":"")+(opt.dim?" dim":"")+(opt.click?" clickable":"");
  const da=opt.a?` data-a="${opt.a}" data-c="${esc(c.id)}"`:` data-a="codexOf" data-c="${esc(c.key)}"`;
  const img=imgUrl(c.key)?`<img src="${esc(imgUrl(c.key))}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('hasimg');this.remove()"/>`:"";
  return `<div class="${cls}${img?" hasimg":""}"${da} style="--c:${d.color||'#555'}" title="${esc(cname(c))}"><div class="top">${d.icon||"?"}</div>${img}${c.num!=null?`<div class="num">${c.num}</div>`:""}${opt.badge?`<div class="bd">${esc(opt.badge)}</div>`:""}<div class="cn">${esc(cbase(c.key))}</div><div class="ph">${esc(phaseName(d.phase))}</div></div>`;
}
const backHtml=(mini)=>`<div class="cd back${mini?" mini":""}">${imgUrl("back-ninja")?`<img src="${esc(imgUrl("back-ninja"))}" alt="" loading="lazy" onerror="this.remove()"/>`:""}🥷</div>`;
function houseHtml(h,big){ if(!h) return `<span class="hs unknown${big?" big":""}">?</span>`; const f=hfam(h); return `<span class="hs ${f}${big?" big":""}">${DATA.houses[f].icon} ${esc(hname(h))}${h==="ronin"?"<small>独行</small>":""}</span>`; }
const mirrorN=()=>cbase("mirror"), martyrN=()=>cbase("martyr"), mmN=()=>cbase("mastermind");
const imgUrl=k=>DATA.artBase?DATA.artBase+k+".webp":"";
// 流派牌大卡(我的牌 / 图鉴):带图,缺图退回色块
function houseCard(h,label){
  if(!h) return `<div class="hcard unknown">${esc(label||"?")}</div>`;
  const f=hfam(h);
  return `<div class="hcard ${f}">${imgUrl(f)?`<img src="${esc(imgUrl(f))}" alt="" loading="lazy" onerror="this.remove()"/>`:""}<div class="nm">${DATA.houses[f].icon} <b>${esc(hname(h))}</b></div></div>`;
}
function curActSeat(){ const ms=mySeats(); if(!ms.length) return null; if(actSeat==null||!ms.includes(actSeat)) actSeat=ms[0]; return actSeat; }
function afterState(prev){
  if(prev&&(prev.phase!==state.phase||prev.sub!==state.sub||prev.round!==state.round||prev.step!==state.step||prev.cur!==state.cur||JSON.stringify(prev.pending&&[prev.pending.seat,prev.pending.stage,prev.pending.card&&prev.pending.card.id])!==JSON.stringify(state.pending&&[state.pending.seat,state.pending.stage,state.pending.card&&state.pending.card.id]))) resetSel();
}
// 一机多座:自动切到"该行动"的座位
function needsAct(n){
  const s=state.seats[n]; if(!s) return false;
  if(state.phase==="draft") return !s.picked;
  if(state.phase==="night"&&state.sub==="declare") return !s.dead&&!s.declared;
  if(state.phase==="night"&&state.pending) return state.pending.seat===n;
  return false;
}
function autoSeat(){ const ms=mySeats(); if(ms.length<2) return; if(actSeat!=null&&needsAct(actSeat)) return; const n=ms.find(needsAct); if(n!=null&&n!==actSeat){ actSeat=n; resetSel(); } }

function roundWhy(r){
  const w=r.winner?`${famName(r.winner)}派获胜`:"没有流派获胜";
  const why=r.reason==="mastermind"?`${r.mastermind}号 亮出${mmN()}`:r.reason==="rank"?`存活 ${famName("crane")}[${r.crane.join(",")}] vs ${famName("lotus")}[${r.lotus.join(",")}]`:r.reason==="tie"?"存活者等级完全相同":"两派都没有存活者";
  return `${w}(${why})`;
}

/* ---- 对局 ---- */
function viewGame(){
  let h=viewScore()+viewPhases()+viewStatus();
  if(mySeats().length){
    if(state.phase==="draft") h+=viewDraft();
    else if(state.phase==="night") h+=viewNight();
  }
  if(state.phase==="night"&&state.sub==="resolve") h+=viewQueue();
  if(state.phase==="roundEnd"||state.phase==="over") h+=viewRoundEnd();
  if(mySeats().length&&state.phase!=="over") h+=viewMine();
  h+=viewPlayers();
  h+=viewNotes();
  if(state.phase!=="over") h+=`<div class="card"><div class="row"><button class="sm ghost" data-a="newGame">终止本局,回到准备</button></div></div>`;

}
function viewScore(){
  return `<div class="score"><span class="sc"><b>第 ${state.round} 轮</b> · ${state.config.points} 分胜 · 标记堆 ${state.poolCount}</span>${seatsArr().map(s=>`<span class="sc${s.dead?" dead":""}"><b>${s.seatNo}</b>${esc(nameOf(s))||"空"}<span class="stars" title="${s.tokenCount} 枚">${stars(s.tokenCount)}</span>${s.points!=null?`<small>${s.points}分</small>`:""}</span>`).join("")}</div>`;
}
function viewPhases(){
  const steps=[{k:"draft",n:"轮抽"}].concat(DATA.phases.map(p=>({k:p.key,n:phaseName(p.key)}))).concat([{k:"reveal",n:"揭示"}]);
  const curIdx=state.phase==="draft"?0:state.phase==="night"?state.step+1:steps.length-1;
  return `<div class="phases">${steps.map((p,i)=>`<span class="pp${i===curIdx?" on":i<curIdx?" done":""}">${esc(p.n)}</span>`).join('<span style="color:var(--fg-soft);font-size:10px;align-self:center">›</span>')}</div>`;
}
function viewStatus(){
  if(state.phase==="over") return `<div class="status">🏆 ${state.result.winners.join("/")}号 达到 ${state.result.need} 分,获胜!</div>`;
  if(state.phase==="roundEnd") return `<div class="status">第 ${state.round} 轮结束 · ${esc(roundWhy(state.roundResult))}<small>任何人点「下一轮」重新发牌</small></div>`;
  if(state.phase==="draft"){ const left=seatsArr().filter(s=>!s.picked).length; return `<div class="status">轮抽 · ${state.sub==="pick1"?"从 3 张里留 1 张":"从收到的 2 张里再留 1 张"}<small>还有 ${left} 人未选;全员选完一起传牌</small></div>`; }
  const pn=PH[state.phaseKey]?PH[state.phaseKey].name:"";
  if(state.sub==="declare"){ const left=seatsArr().filter(s=>!s.dead&&!s.declared).length; return `<div class="status">夜晚 · ${esc(pn)}阶段 · 声明<small>每位存活者声明打出的${esc(pn)}牌或跳过;还有 ${left} 人未声明,收齐后统一翻开</small></div>`; }
  const p=state.pending;
  if(!p) return `<div class="status">夜晚 · ${esc(pn)}阶段 · 结算中</div>`;
  if(p.stage==="react") return `<div class="status">⚔️ ${p.killer}号 的「${esc(cname(p.card))}」选择杀死 ${p.target}号<small>等待 ${p.target}号 决定是否翻开反应牌</small></div>`;
  return `<div class="status">夜晚 · ${esc(pn)}阶段 · ${p.seat}号 正在结算「${esc(cname(p.card))}」${state.youHold.includes(p.seat)?" —— 是你!":""}<small>${p.stage==="decide"?"他已查看,正在决定":"等待他选择目标"}</small></div>`;
}
function seatTabs(){ const ms=mySeats(); if(ms.length<2) return ""; return `<div class="tabs">${ms.map(x=>`<button class="sm ${x===actSeat?"on":""}" data-a="actSeat" data-s="${x}">${x}号${needsAct(x)?" ●":""}</button>`).join("")}</div>`; }

/* 轮抽 */
function viewDraft(){
  const me=curActSeat(), s=state.seats[me], hand=s.hand||[];
  let h=`<div class="card secret act"><h2>🃏 轮抽 <span class="tag">${me}号 · ${state.sub==="pick1"?"留 1 张,其余 2 张传给 "+(nextSeat(me))+"号":"再留 1 张,剩下的弃掉"}</span></h2>${seatTabs()}`;
  if(s.kept&&s.kept.length) h+=`<div class="hint">已留下:</div><div class="hand" style="margin-bottom:8px">${s.kept.map(c=>cardHtml(c,{})).join("")}</div>`;
  if(s.picked){ h+=`<div class="hint">已选「${esc(cname(hand.find(c=>c.id===s.pickedId)||{key:"?"}))}」,等其他人…(还可以改)</div>`; }
  h+=`<div class="hand">${hand.map(c=>cardHtml(c,{big:true,a:"pick",sel:(pickSel||s.pickedId)===c.id,click:true})).join("")}</div>`;
  const sel=pickSel||s.pickedId;
  h+=`<div class="row" style="margin-top:10px"><button class="primary grow" data-a="pickGo" ${pickSel&&pickSel!==s.pickedId?"":"disabled"} style="padding:12px;font-size:15px">留下${sel?" 「"+esc(cname(hand.find(c=>c.id===sel)||{key:"?"}))+"」":""}</button></div>
    <div class="hint">${sel&&C[(hand.find(c=>c.id===sel)||{}).key]?esc(C[hand.find(c=>c.id===sel).key].desc):"点一张牌看效果。"}</div></div>`;
  return h;
}
function nextSeat(n){ const a=seatsArr().map(s=>s.seatNo); return a[(a.indexOf(n)+1)%a.length]; }

/* 夜晚 */
function viewNight(){
  const me=curActSeat(), s=state.seats[me];
  if(state.sub==="declare"){
    if(s.dead) return `<div class="card secret"><h2>💀 ${me}号 已死亡</h2>${seatTabs()}<div class="hint">死人不再出牌,但可以继续说话、出主意。</div></div>`;
    const pk=state.phaseKey, pn=PH[pk].name, mine=(s.hand||[]).filter(c=>C[c.key].phase===pk&&!c.burnt);
    let h=`<div class="card secret act"><h2>🌙 ${esc(pn)}阶段 · 声明 <span class="tag">${me}号</span></h2>${seatTabs()}`;
    if(s.declared){ h+=`<div class="hint">已声明${s.declaredIds&&s.declaredIds.length?`打出 ${s.declaredIds.length} 张`:"跳过"},等其他人…(收齐前还可以改)</div>`; }
    if(!mine.length) h+=`<div class="hint">你手里没有${esc(pn)}牌。点「跳过」—— 别人看不出你有没有。</div>`;
    else h+=`<div class="hint">勾选要打出的${esc(pn)}牌(可多张);没勾的${esc(pn)}牌本轮作废。</div><div class="hand" style="margin-top:6px">${mine.map(c=>cardHtml(c,{big:true,a:"decl",sel:declSel.includes(c.id),click:true})).join("")}</div>`;
    h+=`<div class="row" style="margin-top:10px"><button class="primary grow" data-a="declGo" style="padding:12px;font-size:15px">${declSel.length?`打出 ${declSel.length} 张`:"跳过(不出)"}</button></div></div>`;
    return h;
  }
  const p=state.pending; if(!p) return "";
  if(p.stage==="react"&&p.target===me) return viewReact(me);
  if(p.seat!==me||p.stage==="react") return seatTabs()?`<div class="card">${seatTabs()}<div class="hint">${me}号 等待中。</div></div>`:"";
  return viewResolve(me);
}
function tgtButtons(pool,sel,multi){ return `<div class="tgt">${pool.map(n=>`<button class="${(multi?tgt2.includes(n):sel===n)?"on":""}" data-a="${multi?"tgt2":"tgt"}" data-s="${n}">${n}号 ${esc(nameOf(state.seats[n]))}${state.seats[n].dead?" 💀":""}${n===curActSeat()?"(自己)":""}</button>`).join("")}</div>`; }
function viewResolve(me){
  const p=state.pending, c=p.card, d=C[c.key], pm=state.pendingMine||{}, s=state.seats[me];
  const others=seatsArr().map(x=>x.seatNo).filter(n=>n!==me), othersAlive=others.filter(n=>!state.seats[n].dead);
  let h=`<div class="card secret act"><h2>${d.icon} 结算「${esc(cname(c))}」 <span class="tag">${me}号</span></h2>${seatTabs()}<div class="panel"><div class="ti">${esc(d.name)} <small style="color:var(--fg-soft)">${esc(d.en)}</small></div><div class="tp">${esc(d.desc)}</div></div>`;
  const go=(label,extra,ready)=>`<div class="row" style="margin-top:10px"><button class="primary grow" data-a="resolveGo" data-x='${esc(JSON.stringify(extra))}' ${ready?"":"disabled"} style="padding:12px;font-size:15px">${label}</button></div>`;
  switch(c.key){
    case "spy": case "mystic":
      h+=`<div class="hint">选择要查看的玩家(死人也可以看):</div>${tgtButtons(others,tgtSel)}${go("查看"+(tgtSel?" "+tgtSel+"号":""),{target:tgtSel},tgtSel!=null)}`; break;
    case "shapeshifter":
      if(p.stage==="main"){ const pool=seatsArr().filter(x=>!x.revealed).map(x=>x.seatNo); h+=`<div class="hint">选两名玩家(可含自己;已公开流派牌的人不能选):</div>${tgtButtons(pool,null,true)}${go("查看这两人的流派牌",{targets:tgt2},tgt2.length===2)}`; }
      else { h+=`<div class="hint">你看到的:</div>${p.targets.map(n=>`<div class="note">${n}号 ${esc(nameOf(state.seats[n]))}:${houseHtml(pm.info&&pm.info[n])}</div>`).join("")}<div class="hint">对调后两人都不能再看自己的新流派牌;是否对调只有你知道。</div>
        <div class="row" style="margin-top:10px"><button class="primary grow" data-a="resolveGo" data-x='{"swap":true}' style="padding:12px">🎭 对调</button><button class="grow" data-a="resolveGo" data-x='{"swap":false}' style="padding:12px">不对调</button></div>`; }
      break;
    case "gravedigger":
      if(p.stage==="main") h+=`<div class="hint">弃牌堆 ${state.discardCount} 张。</div>${go("翻看弃牌堆两张",{},true)}`;
      else { const offer=pm.offer||[], oc=offer.find(x=>x.id===offerSel), canNow=oc&&DATA.phases.some(ph=>ph.key===C[oc.key].phase);
        h+=`<div class="hint">翻到(只有你看得到),挑一张:</div><div class="hand" style="margin-top:6px">${offer.map(x=>cardHtml(x,{big:true,a:"offer",sel:offerSel===x.id,click:true})).join("")}</div>`;
        if(oc) h+=`<div class="hint">${esc(C[oc.key].desc)}</div>`;
        h+=`<div class="row" style="margin-top:10px"><button class="primary grow" data-a="resolveGo" data-x='${esc(JSON.stringify({pick:offerSel,play:"now"}))}' ${oc&&canNow?"":"disabled"} style="padding:12px">立刻打出</button><button class="grow" data-a="resolveGo" data-x='${esc(JSON.stringify({pick:offerSel,play:"keep"}))}' ${oc?"":"disabled"} style="padding:12px">面朝上留在面前</button></div>
          <div class="hint">立刻打出 = 插进当前队列马上结算(不管阶段);反应牌/${esc(mmN())}只能留着。留在面前的牌是公开的。</div>`; }
      break;
    case "troublemaker":
      if(p.stage==="main") h+=`<div class="hint">选择要查看的玩家:</div>${tgtButtons(others,tgtSel)}${go("查看"+(tgtSel?" "+tgtSel+"号":""),{target:tgtSel},tgtSel!=null)}`;
      else h+=`<div class="note">${p.target}号 ${esc(nameOf(state.seats[p.target]))}:${houseHtml(state.seats[me].notes&&lastNoteHouse(me))}</div><div class="row" style="margin-top:10px"><button class="primary grow" data-a="resolveGo" data-x='{"reveal":true}' style="padding:12px">📣 公开给所有人</button><button class="grow" data-a="resolveGo" data-x='{"reveal":false}' style="padding:12px">不公开</button></div>`;
      break;
    case "merchant":
      if(p.stage==="main") h+=`<div class="hint">选择玩家:</div>${tgtButtons(others,tgtSel)}<div class="hint">查看他的:</div><div class="tgt"><button class="${lookSel==="honor"?"on":""}" data-a="look" data-k="honor">一枚荣誉标记(随机)</button><button class="${lookSel==="house"?"on":""}" data-a="look" data-k="house">流派牌</button></div>${go("查看",{target:tgtSel,look:lookSel},tgtSel!=null&&lookSel)}`;
      else { const t=state.seats[p.target], myT=s.tokens||[], tt=pm.targetTokens||[];
        h+=`<div class="note">${esc((s.notes||[]).filter(x=>x.round===state.round&&x.text.startsWith(cbase("merchant"))).at(-1)?.text||"")}</div>`;
        if(!myT.length||!tt.length) h+=`<div class="hint">${!myT.length?"你没有荣誉标记":p.target+"号 没有荣誉标记"},不能交换。</div><div class="row" style="margin-top:10px"><button class="primary grow" data-a="resolveGo" data-x='{}' style="padding:12px">结束</button></div>`;
        else h+=`<div class="hint">给出你的一枚:</div><div class="strip">${myT.map(k=>`<span class="tk ${giveSel===k.id?"on":""}" data-a="give" data-k="${k.id}">${k.v}分</span>`).join("")}</div>
          <div class="hint">拿回 ${p.target}号 的一枚(面值暗放):</div><div class="strip">${tt.map(id=>`<span class="tk ${takeSel===id?"on":""}" data-a="take" data-k="${id}">${id===pm.seen?"👁 看过的":"?"}</span>`).join("")}</div>
          <div class="row" style="margin-top:10px"><button class="primary grow" data-a="resolveGo" data-x='${esc(JSON.stringify({give:giveSel,take:takeSel}))}' ${giveSel&&takeSel?"":"disabled"} style="padding:12px">交换</button><button class="grow" data-a="resolveGo" data-x='{}' style="padding:12px">不交换</button></div>`; }
      break;
    case "thief": { const pool=others.filter(n=>state.seats[n].tokenCount>s.tokenCount);
      h+=`<div class="hint">会先亮出你的流派牌 ${houseHtml(s.house)}。${pool.length?"从荣誉标记比你多的人那里随机拿一枚:":"没有人标记比你多,只能亮牌。"}</div>${pool.length?tgtButtons(pool,tgtSel):""}
        <div class="row" style="margin-top:10px"><button class="primary grow" data-a="resolveGo" data-x='${esc(JSON.stringify({target:tgtSel}))}' ${tgtSel!=null?"":"disabled"} style="padding:12px">亮牌并拿走</button><button class="grow" data-a="resolveGo" data-x='{}' style="padding:12px">只亮牌</button></div>`; break; }
    case "judge":
      h+=`<div class="hint">会先亮出你的流派牌 ${houseHtml(s.house)}。处决一名存活玩家(${esc(mirrorN())}/${esc(martyrN())}无效):</div>${tgtButtons(othersAlive,tgtSel)}${go("⚖️ 处决"+(tgtSel?" "+tgtSel+"号":""),{target:tgtSel},tgtSel!=null)}`; break;
    case "blind":
      h+=`<div class="hint">选择要杀死的存活玩家(不看流派牌):</div>${tgtButtons(othersAlive,tgtSel)}${go("🗡️ 杀死"+(tgtSel?" "+tgtSel+"号":""),{target:tgtSel},tgtSel!=null)}`; break;
    case "shinobi":
      if(p.stage==="main") h+=`<div class="hint">选择一名存活玩家,先看他的流派牌:</div>${tgtButtons(othersAlive,tgtSel)}${go("查看"+(tgtSel?" "+tgtSel+"号":""),{target:tgtSel},tgtSel!=null)}`;
      else h+=`<div class="note">${p.target}号 ${esc(nameOf(state.seats[p.target]))}:${houseHtml(lastNoteHouse(me))}</div><div class="row" style="margin-top:10px"><button class="primary grow" data-a="resolveGo" data-x='{"kill":true}' style="padding:12px">🌙 杀死 ${p.target}号</button><button class="grow" data-a="resolveGo" data-x='{"kill":false}' style="padding:12px">放过</button></div>`;
      break;
    default: h+=`<div class="hint">未知牌。</div>`;
  }
  return h+`</div>`;
}
// 从最新一条笔记里抠出流派(上忍/捣乱者决定面板显示用)
function lastNoteHouse(me){ const t=((state.seats[me].notes||[]).filter(x=>x.round===state.round).at(-1)||{}).text||""; const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); const m=new RegExp("「("+esc2(famName("crane"))+"|"+esc2(famName("lotus"))+") (\\d)」").exec(t); if(m) return (m[1]===famName("crane")?"crane":"lotus")+":"+m[2]; return new RegExp("「"+esc2(famName("ronin"))+"」").test(t)?"ronin":null; }
function viewReact(me){
  const p=state.pending, opts=(state.pendingMine||{}).options||[], s=state.seats[me];
  let h=`<div class="card secret act"><h2>⚔️ 你被 ${p.killer}号 的「${esc(cname(p.card))}」盯上了 <span class="tag">${me}号</span></h2>${seatTabs()}<div class="hint">你手里有反应牌,可以翻开一张:</div><div class="hand" style="margin-top:6px">${opts.map(id=>{ const c=(s.hand||[]).find(x=>x.id===id)||{id,key:id,num:null}; return cardHtml(c,{big:true,a:"reactPick",sel:tgtSel===id,click:true}); }).join("")}</div>`;
  if(tgtSel) h+=`<div class="hint">${esc(C[tgtSel]?C[tgtSel].desc:"")}</div>`;
  h+=`<div class="row" style="margin-top:10px"><button class="primary grow" data-a="reactGo" ${tgtSel?"":"disabled"} style="padding:12px">翻开 ${tgtSel?esc(cbase(tgtSel)):""}</button><button class="grow" data-a="reactNone" style="padding:12px">不翻(接受死亡)</button></div></div>`;
  return h;
}
function viewQueue(){
  if(!state.queue.length) return "";
  return `<div class="card"><h2>本阶段翻开的牌 <span class="tag">按编号结算</span></h2><div class="queue">${state.queue.map((q,i)=>`<div class="qi${i===state.cur&&!q.done?" cur":""}${q.done?" done":""}${q.void?" void":""}">${cardHtml(q.card,{})}<span>${q.owner}号${q.void?" 作废":q.done?" ✓":i===state.cur?" ◀":""}</span></div>`).join("")}</div></div>`;
}
/* 我的牌 */
function viewMine(){
  const me=curActSeat(), s=state.seats[me]; if(!s) return "";
  let h=`<div class="card secret"><h2>🪪 ${me}号 的牌 <span class="tag">只有你看得到</span></h2>${state.phase==="draft"||state.phase==="night"?"":seatTabs()}
    <div class="row" style="align-items:flex-start">${s.house?houseCard(s.house):houseCard(null,s.cantLook?`被${cbase("shapeshifter")}对调过,不能再看`:"?")}<div class="grow"><div>流派牌${s.house?":"+esc(hname(s.house)):""}</div><div class="row" style="margin-top:4px">${s.revealed?`<span class="chip gold">已公开</span>`:`<span class="chip">只有你知道</span>`}${s.dead?`<span class="chip red">💀 已死亡</span>`:""}</div></div></div>
    <div class="row" style="margin-top:6px"><span>荣誉标记:</span>${(s.tokens||[]).length?(s.tokens||[]).map(k=>`<span class="tk">${k.v}分</span>`).join(""):'<span class="hint" style="margin:0">无</span>'}<span class="chip gold">合计 ${s.points||0} 分</span></div>`;
  if(state.phase==="night"){ const hand=s.hand||[]; h+=`<div class="hint" style="margin-top:8px">手里的忍者牌:</div><div class="hand" style="margin-top:4px">${hand.length?hand.map(c=>cardHtml(c,{dim:c.burnt,badge:c.burnt?"作废":c.faceUp?"公开":null})).join(""):'<span class="hint" style="margin:0">没有了</span>'}</div>`; }
  return h+`</div>`;
}
function viewPlayers(){
  let h=`<div class="card"><h2>牌桌 <span class="tag">打出的牌公开</span></h2>`;
  const p=state.pending;
  for(const s of seatsArr()){
    const mine=state.youHold.includes(s.seatNo), acting=p&&(p.stage==="react"?p.target===s.seatNo:p.seat===s.seatNo);
    const waiting=state.phase==="draft"?!s.picked:state.phase==="night"&&state.sub==="declare"?(!s.dead&&!s.declared):false;
    h+=`<div class="pl${acting?" act":""}${mine?" mine":""}${s.dead?" dead":""}"><div class="grow"><div class="ph"><span class="no">${s.seatNo}</span><span class="nm">${esc(nameOf(s))||"空位"}</span>
      ${s.house&&(s.revealed||state.phase==="roundEnd"||state.phase==="over")?houseHtml(s.house):mine&&s.house?`<span class="chip gold">我:${esc(hname(s.house))}</span>`:""}
      ${s.dead?`<span class="bd dead">💀 死亡</span>`:""}${acting?`<span class="bd on">▶ 行动中</span>`:""}${waiting?`<span class="bd">⏳ 未${state.phase==="draft"?"选":"声明"}</span>`:(state.phase==="draft"||(state.phase==="night"&&state.sub==="declare"))&&!s.dead?`<span class="bd ok">✓</span>`:""}
      <span class="stars" title="${s.tokenCount} 枚">${stars(s.tokenCount)}</span></div>
      <div class="lb">本轮打出</div><div class="strip">${s.played.length?s.played.map(c=>cardHtml(c,{mini:true})).join(""):`<span class="hint" style="margin:0">—</span>`}</div></div>
      <div class="hd">${Array.from({length:Math.max(0,s.handCount-s.faceUp.length)}).map(()=>backHtml(true)).join("")}${s.faceUp.map(c=>cardHtml(c,{mini:true})).join("")}</div></div>`;
  }
  return h+`</div>`;
}
function viewNotes(){
  const ms=mySeats(); if(!ms.length) return "";
  let h="";
  for(const n of ms){ const s=state.seats[n], notes=(s.notes||[]).filter(x=>x.round===state.round);
    if(notes.length) h+=`<div class="card secret"><h2>🔒 ${n}号 的私密情报 <span class="tag">本轮 · 只有你看得到</span></h2>${notes.map(x=>`<div class="note">${esc(x.text)}</div>`).join("")}</div>`; }
  return h;
}
function viewRoundEnd(){
  const r=state.roundResult; if(!r) return "";
  const over=state.phase==="over";
  let h=`<div class="card result"><div class="big">${over?`🏆 ${state.result.winners.join("/")}号 获胜`:r.winner?`${DATA.houses[r.winner].icon} ${esc(famName(r.winner))}派赢得第 ${r.round} 轮`:`第 ${r.round} 轮 · 没有流派获胜`}</div>
    <div class="hint" style="text-align:center">${esc(roundWhy(r))}</div>
    <table class="vt"><tr><th>座位</th><th>流派牌</th><th>状态</th><th>本轮</th><th>标记</th>${over?"<th>总分</th>":""}</tr>`;
  for(const s of seatsArr()){ const a=r.awarded.find(x=>x.seat===s.seatNo);
    h+=`<tr class="${(over?state.result.winners.includes(s.seatNo):!!a)?"win":""}"><td>${s.seatNo}号 ${esc(nameOf(s))}</td><td>${houseHtml(r.houses[s.seatNo])}</td><td>${r.dead.includes(s.seatNo)?"💀 死亡":"存活"}</td><td>${a?"+★ "+esc(a.why):"—"}</td><td class="stars" style="color:var(--gold)">${stars(r.tokenCount[s.seatNo])}</td>${over?`<td><b>${state.result.points[s.seatNo]}</b> <small>(${(state.result.tokens[s.seatNo]||[]).join("+")||0})</small></td>`:""}</tr>`; }
  h+=`</table><div class="row" style="margin-top:10px">${over?`<button class="primary grow" data-a="newGame" style="padding:12px;font-size:15px">再来一局</button>`:`<button class="primary grow" data-a="nextRound" style="padding:12px;font-size:15px">下一轮(重新发牌)</button>`}</div></div>`;
  return h;
}
function viewLog(){ return `<div class="card"><details><summary>📜 日志(公开)</summary><div class="log">${(state.log||[]).map(l=>`<div>${esc(l)}</div>`).join("")}</div></details></div>`; }

/* ============ 交互 ============ */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, sn=+b.dataset.s;
  switch(a){
    case "close": closeModal(); break;
    case "closeMask": if(e.target===b) closeModal(); break;
    case "rename": RC.promptRename(); break;
    case "codex": openCodex(); break;
    case "codexOf": openCodex(b.dataset.c); break;
    case "hist": openHistory(); break;
    case "disband": if(confirm("解散房间?所有人都会被踢出,房间数据清空。")) RC.send({type:"disbandRoom"}); break;
    case "claim": RC.send({type:"claimSeat",seatNo:sn}); break;
    case "takeover": { const s=state.seats[sn]; if(confirm(`座位 ${sn} 当前由「${nameOf(s)}」持有,替换成你?`)) RC.send({type:"takeoverSeat",seatNo:sn}); break; }
    case "release": RC.send({type:"releaseSeat",seatNo:sn}); break;
    case "addSeat": RC.send({type:"addSeat"}); break;
    case "removeSeat": { const last=seatsArr().at(-1); if(!last||!last.holderDevices.length||confirm(`${last.seatNo} 号座位有人,确定删除?`)) RC.send({type:"removeSeat"}); break; }
    case "start": act("startGame"); break;
    case "names": act("setConfig",{config:{names:b.dataset.k}}); break;
    case "actSeat": actSeat=sn; resetSel(); render(); break;
    case "pick": pickSel=pickSel===b.dataset.c?null:b.dataset.c; render(); break;
    case "pickGo": if(pickSel) act("draftPick",{seatNo:curActSeat(),cardId:pickSel}); break;
    case "decl": { const id=b.dataset.c; declSel=declSel.includes(id)?declSel.filter(x=>x!==id):declSel.concat([id]); render(); break; }
    case "declGo": act("declare",{seatNo:curActSeat(),cards:declSel}); break;
    case "tgt": tgtSel=tgtSel===sn?null:sn; render(); break;
    case "tgt2": tgt2=tgt2.includes(sn)?tgt2.filter(x=>x!==sn):tgt2.concat([sn]).slice(-2); render(); break;
    case "look": lookSel=b.dataset.k; render(); break;
    case "give": giveSel=giveSel===b.dataset.k?null:b.dataset.k; render(); break;
    case "take": takeSel=takeSel===b.dataset.k?null:b.dataset.k; render(); break;
    case "offer": offerSel=offerSel===b.dataset.c?null:b.dataset.c; render(); break;
    case "resolveGo": { let x={}; try{ x=JSON.parse(b.dataset.x||"{}"); }catch(err){} const k=state.pending&&state.pending.card.key;
      if((k==="blind"||k==="judge"||(k==="shinobi"&&x.kill))&&!confirm(`确定杀死 ${x.target!=null?x.target:state.pending.target}号?`)) break;
      act("resolve",Object.assign({seatNo:curActSeat()},x)); break; }
    case "reactPick": tgtSel=tgtSel===b.dataset.c?null:b.dataset.c; render(); break;
    case "reactGo": if(tgtSel) act("react",{seatNo:curActSeat(),cardId:tgtSel}); break;
    case "reactNone": if(confirm("不翻反应牌,接受死亡?")) act("react",{seatNo:curActSeat(),cardId:null}); break;
    case "nextRound": act("nextRound"); break;
    case "newGame": if(state.phase==="over"||state.phase==="roundEnd"||confirm("终止本局回到准备阶段?所有标记清零。")) act("newGame"); break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="cf-points") act("setConfig",{config:{points:+t.value}});
  if(/^cf-t[234]$/.test(t.id)){ const v=+t.id.slice(4); act("setConfig",{config:{tokens:{[v]:Math.max(0,parseInt(t.value||"0",10))}}}); }
});
document.getElementById("rcNow").onclick=()=>RC.reconnectNow();
render();
</script>
</body>
</html>
