<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>武将数据 · 三国杀线下房间</title>
<!-- 武将数据页(2026-10-21,用户提的):按历史对局(/api/history,最近 300 局 / 180 天)算每个武将的 出框率 / 选取率 / ban率,
     分三组:5 人以上 / 4 人 / 3 人(斗地主)。数据:记录里的 offered(出框)/ banCands(ban 候选)/ banned(被 ban)是武将 id,seats[].general 是选定的武将名。
     口径:出框率 = 出框局数 / 该组局数;选取率 = 选定局数 / 出框局数(手动选将没出框 → 只计选定次数);ban率 = 被 ban 次数 / 进 ban 候选次数。-->
<style>
:root{--paper:#f3ecdc;--paper2:#faf6ec;--ink:#2b2416;--soft:#6b6252;--line:#d8cfb8;--seal:#a32e22;--qi:#b9a26a;--wei:#2b5fa5;--shu:#a33322;--wu:#2f7d4f;--qun:#7a6320;--jin:#6b4a86;--shen:#a06a1a}
*{box-sizing:border-box}body{margin:0;padding:14px 12px 40px;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--soft);font-size:12px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;border:1px solid var(--line);border-radius:7px;background:var(--paper2);color:var(--ink);padding:6px 10px}
button.on{background:var(--ink);color:#f6ecd8;border-color:var(--ink)}
.card{background:var(--paper2);border:1px solid var(--line);border-top:3px solid var(--seal);border-radius:10px;padding:10px 12px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--soft);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--paper2)}th.on{color:var(--seal)}
td:first-child,th:first-child{text-align:left}td:nth-child(2),th:nth-child(2){text-align:left}
.nm{font-weight:600}.fc{display:inline-block;font-size:10px;border-radius:3px;padding:0 4px;border:1px solid var(--line);margin-left:4px;vertical-align:1px}
.fc.wei{color:var(--wei);border-color:var(--wei)}.fc.shu{color:var(--shu);border-color:var(--shu)}.fc.wu{color:var(--wu);border-color:var(--wu)}.fc.qun{color:var(--qun);border-color:var(--qun)}.fc.jin{color:var(--jin);border-color:var(--jin)}.fc.shen{color:var(--shen);border-color:var(--shen)}
.bar{display:inline-block;height:8px;background:var(--qi);border-radius:4px;vertical-align:middle;margin-right:4px}.bar.red{background:var(--seal)}.bar.grn{background:var(--wu)}
.hint{font-size:12px;color:var(--soft)}.wrap{overflow-x:auto}
</style></head><body>
<h1>武将数据</h1>
<div class="sub">按历史对局统计 · 最近 <span id="meta">…</span> · <a href="/" style="color:var(--seal)">← 回房间</a></div>
<div class="row" id="groups"></div>
<div class="row" style="margin-top:8px"><input id="q" placeholder="搜武将名" style="flex:1 1 0;min-width:0"><select id="show"><option value="any">出过框 / 选过 / ban 过的</option><option value="picked">只看选过的</option><option value="banned">只看被 ban 过的</option><option value="all">全部武将</option></select></div>
<div class="card"><div class="hint" id="desc"></div><div class="wrap"><table id="t"><thead><tr>
<th data-k="name">武将</th><th data-k="fac">势力</th><th data-k="offered">出框</th><th data-k="offRate">出框率</th><th data-k="picked">选定</th><th data-k="pickRate">选取率</th><th data-k="banCand">ban 候选</th><th data-k="banned">被 ban</th><th data-k="banRate">ban率</th></tr></thead><tbody></tbody></table></div></div>
<div class="hint" style="margin-top:8px">口径:出框率 = 出现在候选框的局数 ÷ 该组局数;选取率 = 选定落座的局数 ÷ 出框局数(手动选将的局没有候选框,只计入「选定」);ban率 = 被临时 ban 的次数 ÷ 进 ban 候选的次数。同名武将各版本分开算。历史只保留最近 300 局 / 180 天。</div>
<script>
"use strict";
const $=s=>document.querySelector(s), esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FCLS={魏:"wei",蜀:"shu",吴:"wu",群:"qun",晋:"jin",神:"shen"};
const GROUPS=[["big","5 人以上",n=>n>=5],["four","4 人",n=>n===4],["three","3 人 · 斗地主",n=>n===3]];
let HEROES=[],BY_ID=new Map(),BY_NAME=new Map(),LIST=[],group="big",sortK="offered",sortD=-1,q="",show="any";
function players(r){return (r.seats||[]).filter(s=>s.player||s.general).length;}
function compute(){
  const [,label,pred]=GROUPS.find(g=>g[0]===group);
  const recs=LIST.filter(r=>pred(players(r)));
  const st=new Map(); const get=id=>{if(!st.has(id))st.set(id,{offered:0,picked:0,banCand:0,banned:0});return st.get(id);};
  for(const r of recs){
    for(const id of new Set(r.offered||[]))get(id).offered++;
    for(const id of new Set(r.banCands||[]))get(id).banCand++;
    for(const id of r.banned||[])get(id).banned++;
    for(const s of r.seats||[]){const h=s.general&&BY_NAME.get(s.general);if(h)get(h.id).picked++;}
  }
  $("#desc").innerHTML=`<b>${esc(label)}</b> · ${recs.length} 局 · 有候选框记录的 ${recs.filter(r=>(r.offered||[]).length).length} 局 · 开过临时 ban 的 ${recs.filter(r=>(r.banCands||[]).length).length} 局`;
  const rows=[];
  for(const h of HEROES){
    const s=st.get(h.id)||{offered:0,picked:0,banCand:0,banned:0};
    const any=s.offered||s.picked||s.banCand||s.banned;
    if(show==="any"&&!any)continue; if(show==="picked"&&!s.picked)continue; if(show==="banned"&&!s.banned)continue;
    if(q&&!h.name.includes(q)&&!(h.py||"").replace(/ /g,"").startsWith(q.toLowerCase()))continue;
    rows.push({id:h.id,name:h.name,fac:h.factionSelectable?"神":(h.faction||"?"),...s,offRate:recs.length?s.offered/recs.length:0,pickRate:s.offered?s.picked/s.offered:(s.picked?1:0),banRate:s.banCand?s.banned/s.banCand:0});
  }
  rows.sort((a,b)=>{const x=a[sortK],y=b[sortK];if(typeof x==="string")return sortD*x.localeCompare(y,"zh");return sortD*((x-y)||(b.offered-a.offered)||(b.picked-a.picked))||a.name.localeCompare(b.name,"zh");});
  const pct=v=>(v*100).toFixed(0)+"%", bar=(v,c)=>`<span class="bar ${c||""}" style="width:${Math.round(Math.min(1,v)*40)}px"></span>`;
  $("#t tbody").innerHTML=rows.map(r=>`<tr><td class="nm">${esc(r.name)}</td><td><span class="fc ${FCLS[r.fac]||""}">${esc(r.fac)}</span></td><td>${r.offered}</td><td>${bar(r.offRate)}${pct(r.offRate)}</td><td>${r.picked}</td><td>${r.offered?bar(r.pickRate,"grn")+pct(r.pickRate):(r.picked?"<span class='hint'>手动 ×"+r.picked+"</span>":"—")}</td><td>${r.banCand}</td><td>${r.banned}</td><td>${r.banCand?bar(r.banRate,"red")+pct(r.banRate):"—"}</td></tr>`).join("")||`<tr><td colspan="9" class="hint">这一组还没有记录</td></tr>`;
  document.querySelectorAll("th").forEach(th=>th.classList.toggle("on",th.dataset.k===sortK));
  document.querySelectorAll("#groups button").forEach(b=>b.classList.toggle("on",b.dataset.g===group));
}
$("#groups").innerHTML=GROUPS.map(([k,l])=>`<button data-g="${k}">${l}</button>`).join("");
$("#groups").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;group=b.dataset.g;compute();});
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=(k==="name"||k==="fac")?1:-1;}compute();});
$("#q").oninput=e=>{q=e.target.value.trim();compute();}; $("#show").onchange=e=>{show=e.target.value;compute();};
(async()=>{
  const [g,h]=await Promise.all([fetch("/generals.json").then(r=>r.json()),fetch("/api/history",{cache:"no-store"}).then(r=>r.json())]);
  HEROES=g; for(const x of g){BY_ID.set(x.id,x);BY_NAME.set(x.name,x);}
  LIST=h.list||[]; $("#meta").textContent=`${LIST.length} 局(保留 ${h.keep} 局 / ${h.days} 天)`;
  const counts=GROUPS.map(([k,l,p])=>l+" "+LIST.filter(r=>p(players(r))).length+"局");
  document.querySelectorAll("#groups button").forEach((b,i)=>b.textContent=counts[i]);
  compute();
})().catch(e=>{$("#desc").textContent="读取失败:"+e.message;});
</script></body></html>
