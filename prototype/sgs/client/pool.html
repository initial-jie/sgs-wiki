<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>将池编辑 · 三国杀线下房间</title>
<style>
/* 将池编辑页:各环境(军争/2v2/斗地主/1v1)各一份 白名单(可发将)+ 黑名单(禁将)。
   全部武将按「包」分组,点武将加入/移出当前名单;保存即写服务端(SgsConfigDO),房间下次发将/选将即生效,不用 deploy。
   数据:/generals.json(带 pack 字段,新录武将自动出现)+ /api/pool(GET 读 / PUT 存)。 */
:root{--bg:#efe6d2;--paper:#fbf7ef;--ink:#2b2419;--soft:#7a6f60;--line:#d9cfbd;--seal:#a32e22;--qi:#c2982f;
  --wei:#2b6cb0;--shu:#b23b2e;--wu:#2f7d4f;--qun:#6b6257;--jin:#6a4a9c;--shen:#b08a1e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:0 12px 80px;max-width:900px;margin:0 auto}
h1{font-size:20px;letter-spacing:.06em;margin:14px 0 2px;text-align:center}
.sub{text-align:center;color:var(--soft);font-size:12px;margin-bottom:10px}
button{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:6px 11px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--seal);border-color:var(--seal);color:#f6ecd8;font-weight:600}
button.mini{font-size:12px;padding:2px 9px;color:var(--soft)}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--paper);color:var(--ink);min-width:0}
#bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 0;min-width:0}
#count{font-weight:700;font-size:15px}
#dirty{font-size:12px;color:var(--seal);font-weight:600}
.fl{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 11px;background:transparent;color:var(--soft)}
.fl.on{border-color:var(--seal);color:var(--seal);font-weight:600}
/* 环境切换 + 白/黑页签 */
.env{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:transparent;color:var(--soft);text-align:left;line-height:1.25}
.env small{display:block;font-size:11px;font-weight:400}
.env.on{border-color:var(--ink);color:var(--ink);font-weight:700;background:var(--paper)}
.tab{flex:1 1 0;font-size:14px;padding:7px 8px;border-radius:8px;background:transparent;color:var(--soft)}
.tab.on.white{background:#fff7e6;border-color:var(--qi);color:var(--ink);font-weight:700}
.tab.on.ban{background:#fbeceb;border-color:var(--seal);color:var(--seal);font-weight:700}
#tip{font-size:12px;color:var(--soft);margin-top:6px}
details.fam{background:rgba(255,252,244,.75);border:1px solid var(--line);border-top:3px solid var(--seal);border-radius:9px;margin-top:11px;padding:0 12px 8px}
details.fam>summary{cursor:pointer;padding:10px 0 8px;font-weight:800;font-size:16px;letter-spacing:.06em;list-style:none;display:flex;gap:8px;align-items:center}
details.fam>summary::-webkit-details-marker{display:none}
details.fam>summary::before{content:"▸";color:var(--soft);font-size:12px}
details.fam[open]>summary::before{content:"▾"}
.cnt{font-size:12px;font-weight:400;color:var(--soft);letter-spacing:0}
.cnt b{color:var(--seal)}
.pack{border-top:1px dashed var(--line);padding:8px 0 4px}
.pack-h{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.pack-h .nm{font-weight:700;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.h{font-size:13px;padding:3px 9px 3px 7px;border-radius:6px;border:1px solid var(--line);border-left:4px solid var(--qun);background:transparent;color:var(--soft);position:relative}
.h.f-wei{border-left-color:var(--wei)}.h.f-shu{border-left-color:var(--shu)}.h.f-wu{border-left-color:var(--wu)}
.h.f-jin{border-left-color:var(--jin)}.h.f-shen{border-left-color:var(--shen)}
/* 临时 ban 池页:选中=进临时 ban 池(紫);发将开「本局临时 ban」时各人从中随机 3~5 选 1 ban 掉;不在本环境将池里的将加删除线(ban 了也没意义) */
body.l-temp .h.on{background:#efe9f6;color:#4d3a72;border-color:#6b4a86;font-weight:600}
body.l-temp .h.on::after{content:"⌛";margin-left:4px;font-size:11px}
body.l-temp .h.x{text-decoration:line-through;text-decoration-color:#6b4a86}
.tab.temp.on{background:#6b4a86;border-color:#6b4a86;color:#fff}
/* 白名单页:选中=入池(金);该环境被禁的将加删除线提示 */
body.l-white .h.on{background:#fff7e6;color:var(--ink);border-color:var(--qi);font-weight:600}
body.l-white .h.on::after{content:"✓";color:var(--seal);margin-left:4px;font-size:11px}
body.l-white .h.x{text-decoration:line-through;text-decoration-color:var(--seal)}
/* 白名单页补充:「随」= 没勾但同名坑已入池(发将时同样可选) */
body.l-white .h.fol{border-style:dashed;border-color:var(--qi);color:var(--ink)}
body.l-white .h.fol::after{content:"随";color:var(--qi);margin-left:4px;font-size:10px}
.setc{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:4px 12px;background:transparent;color:var(--soft)}
.setc.on{border-color:var(--ink);color:var(--ink);font-weight:700;background:var(--paper)}
.setc small{font-weight:400;font-size:11px;margin-left:5px}
.setl{font-size:12px;color:var(--soft)}
/* 黑名单页:选中=禁用(红);在本环境将池里的将加粗提示(禁的通常是池内强将) */
body.l-ban .h.on{background:#fbeceb;color:var(--seal);border-color:var(--seal);font-weight:600}
body.l-ban .h.on::after{content:"⊘";margin-left:4px;font-size:11px}
body.l-ban .h.x{color:var(--ink);border-style:dashed}
.h.new::before{content:"新";position:absolute;top:-7px;right:-5px;font-size:9px;background:var(--seal);color:#fff;border-radius:8px;padding:0 4px;line-height:14px;font-weight:400}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(43,36,25,.92);color:#f6ecd8;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
#exp{display:none;margin-top:8px}
#exp textarea{width:100%;height:110px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--paper)}
.legend{font-size:12px;color:var(--soft);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 9px;vertical-align:-1px}
</style>
</head>
<body class="l-white">
<h1>将池编辑</h1>
<div class="sub">各环境的白名单(可发将)、黑名单(禁将)、临时 ban 池;黑白名单可分套组 · 保存后房间立即生效</div>

<div id="bar">
  <div class="row">
    <span id="count">加载中…</span><span id="dirty"></span>
    <span class="grow"></span>
    <button id="b-exp" class="mini">导出</button>
    <button id="b-save" class="primary" disabled>保存</button>
  </div>
  <div class="row" id="envs" style="margin-top:7px"></div>
  <div class="row" style="margin-top:7px">
    <button class="tab white on" data-list="white">白名单 · 可发将</button>
    <button class="tab ban" data-list="ban">黑名单 · 禁将</button>
    <button class="tab temp" data-list="temp">临时 ban 池</button>
  </div>
  <div class="row hide" id="sets" style="margin-top:7px"></div>
  <div id="tip"></div>
  <div class="row" style="margin-top:7px">
    <input id="q" class="grow" placeholder="搜武将名 / 拼音 / 首字母,如 关羽 guanyu gy" autocomplete="off" autocapitalize="off">
    <button class="fl on" data-f="all">全部</button>
    <button class="fl" data-f="on">已选</button>
    <button class="fl" data-f="off">未选</button>
    <button class="fl" data-f="new">新录入</button>
    <button class="fl hide" data-f="diff" id="f-diff">与默认不同</button>
  </div>
  <div id="exp"><textarea readonly></textarea>
    <div class="row" style="margin-top:5px"><button id="b-copy" class="mini">复制</button><span class="legend" style="margin:0">发给 Claude 可作为仓库里的种子/备份快照</span></div></div>
</div>

<div class="legend">势力色条:<i style="background:var(--wei)"></i>魏<i style="background:var(--shu)"></i>蜀<i style="background:var(--wu)"></i>吴<i style="background:var(--qun)"></i>群<i style="background:var(--jin)"></i>晋<i style="background:var(--shen)"></i>神</div>
<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 大类(包名「-」前的部分)展示顺序;没列到的排在「国战」之前。国战默认折叠(一般不进身份局将池)
const FAM_ORDER=["标准","神话再临","界限突破","一将成名","界一将","SP","璀璨星河","门阀士族","谋","魔","祈福","文德武备","闪","限定","不臣之君","线下","移动版","其他"];
const FAM_LAST=["国战"];
const FCLS={"魏":"wei","蜀":"shu","吴":"wu","群":"qun","晋":"jin","神":"shen","魔":"shen"};
let HEROES=[],KEYS=[],CFG={},seen=new Set(),hasSaved=false,savedSnap="",filter="all",q="";
let env="",list="white"; // 当前环境 / 当前名单(white|ban|temp)
let setId="";            // 黑 / 白名单页正在看的套组 id(""=默认名单)
const SET_MAX=8,SET_NAME_MAX=10; // 与 shared/deal.mjs POOL_SET_MAX / POOL_SET_NAME_MAX 一致
const closed=new Set(FAM_LAST);
const DEF=()=>KEYS[0];                       // 默认环境(军争):其它环境白名单留空时沿用它
// —— 将池套组:每套一份独立的黑白名单 {id,name,white:Set,ban:Set}(语义同 shared/deal.mjs applyPoolSet;临时 ban 池不分套)——
const curSet=()=>list!=="temp"&&setId?(CFG[env].sets.find(s=>s.id===setId)||null):null; // 正在编辑的套组(null=默认名单)
const cur=()=>{const st=curSet();return st?st[list]:CFG[env][list];}; // 当前正在编辑的那个 Set
const curBan=()=>{const st=curSet();return st?st.ban:CFG[env].ban;};          // 当前这套的黑名单
const curWhite=()=>{const st=curSet();return st?st.white:effWhite(env);};   // 当前这套实际生效的白名单
const effWhite=k=>CFG[k].white.size?CFG[k].white:CFG[DEF()].white; // 该环境实际生效的(默认)白名单
// 入池的坑 = 至少有一个「勾选且没被禁」版本的同名组(与 buildDealPools 同规则;不臣之君是模式专属,不算)
function poolGroups(w,b){const g=new Set();for(const h of HEROES)if(w.has(h.id)&&!b.has(h.id)&&h.genre!=="不臣之君")g.add(h.gk);return g;}
let VIEW={w:new Set(),b:new Set(),groups:new Set()}; // 白名单页当前视图(refresh 时算):勾选 / 被禁 / 入池的坑
const isFollow=h=>!VIEW.w.has(h.id)&&!VIEW.b.has(h.id)&&!h.wlStrict&&h.genre!=="不臣之君"&&VIEW.groups.has(h.gk); // 没勾但随同名坑可选
function calcView(){const on=list==="white",w=on?cur():new Set(),b=on?curBan():new Set();VIEW={w,b,groups:on?poolGroups(w,b):new Set()};}

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800);}
const famOf=p=>String(p||"其他").split("-")[0];
function famRank(f){const i=FAM_ORDER.indexOf(f);if(i>=0)return i;if(FAM_LAST.includes(f))return 900+FAM_LAST.indexOf(f);return 500;}
const sorted=s=>[...s].sort((a,b)=>a-b);
const setsOut=k=>CFG[k].sets.map(s=>({id:s.id,name:s.name,white:sorted(s.white),ban:sorted(s.ban)}));
const snap=()=>JSON.stringify(KEYS.map(k=>[sorted(CFG[k].white),sorted(CFG[k].ban),sorted(CFG[k].temp),setsOut(k)]));
const effTemp=k=>CFG[k].temp.size?CFG[k].temp:CFG[DEF()].temp; // 临时 ban 池同白名单规则:该环境为空 → 沿用军争
const dirty=()=>snap()!==savedSnap;
function matches(h){
  const s=cur(),st=curSet();
  if(filter==="on"&&!s.has(h.id))return false;
  if(filter==="off"&&s.has(h.id))return false;
  if(filter==="new"&&!(hasSaved&&!seen.has(h.id)))return false;
  if(filter==="diff"&&!(st&&st[list].has(h.id)!==CFG[env][list].has(h.id)))return false; // 这一套与默认(白 / 黑)名单勾选不同的武将
  if(!q)return true;
  if(/[一-鿿]/.test(q))return h.name.includes(q);
  const py=(h.py||"").split(" "),t=q.toLowerCase();
  if(!py[0])return false;
  if(py.join("").startsWith(t)||py.map(x=>x[0]).join("").startsWith(t))return true;
  for(let i=1;i<py.length;i++)if(py.slice(i).join("").startsWith(t))return true; // 音节边界起的后缀(guanyu 中 界关羽)
  return false;
}

function build(){
  const fams=new Map();
  for(const h of HEROES){
    const p=h.pack||h.genre||"其他",f=famOf(p);
    if(!fams.has(f))fams.set(f,new Map());
    const packs=fams.get(f); if(!packs.has(p))packs.set(p,[]);
    packs.get(p).push(h);
  }
  const fkeys=[...fams.keys()].sort((a,b)=>famRank(a)-famRank(b)||a.localeCompare(b,"zh"));
  let html="";
  for(const f of fkeys){
    const packs=fams.get(f);
    const pkeys=[...packs.keys()].sort((a,b)=>a.localeCompare(b,"zh",{numeric:true}));
    html+=`<details class="fam" data-fam="${esc(f)}"${closed.has(f)?"":" open"}><summary>${esc(f)}<span class="cnt" data-fcnt="${esc(f)}"></span><span class="grow"></span>`
      +`<button class="mini" data-fall="${esc(f)}">全选</button><button class="mini" data-fnone="${esc(f)}">清空</button></summary>`;
    for(const p of pkeys){
      html+=`<div class="pack" data-pack="${esc(p)}"><div class="pack-h"><span class="nm">${esc(p)}</span><span class="cnt" data-pcnt="${esc(p)}"></span><span class="grow"></span>`
        +`<button class="mini" data-pall="${esc(p)}">全选</button><button class="mini" data-pnone="${esc(p)}">清空</button></div><div class="chips">`;
      for(const h of packs.get(p))
        html+=`<button class="h f-${FCLS[h.faction]||"qun"}" data-id="${h.id}" title="${esc(h.name)} · ${esc(h.faction||"")} · ${h.hp||"?"}血${h.quality?" · "+esc(h.quality):""}${h.tool?" · 有房间工具":""}">${esc(h.name)}</button>`;
      html+=`</div></div>`;
    }
    html+=`</details>`;
  }
  $("#app").innerHTML=html;
  document.querySelectorAll("details.fam").forEach(d=>d.addEventListener("toggle",()=>{d.open?closed.delete(d.dataset.fam):closed.add(d.dataset.fam);}));
  refresh();
}
// 不重建 DOM:只切 class / 计数(保住滚动位置与折叠状态)
function refresh(){
  if(setId&&!CFG[env].sets.some(x=>x.id===setId)) setId=""; // 换了环境 / 套组被删 → 回到默认名单
  const st=curSet(); if(filter==="diff"&&!st){filter="all";document.querySelectorAll(".fl").forEach(b=>b.classList.toggle("on",b.dataset.f==="all"));}
  calcView();
  const byId=new Map(HEROES.map(h=>[h.id,h])),s=cur();
  // x 标记:白名单页=这一套黑名单里的将;黑名单页=这一套白名单里的将(都跟着当前套组走)
  const mark=list==="white"?curBan():list==="ban"?curWhite():new Set(); // 临时 ban 页:下面单独算
  if(list==="temp"){ const w=effWhite(env),b=CFG[env].ban; for(const h of HEROES) if(!w.has(h.id)||b.has(h.id)) mark.add(h.id); } // 不在本环境将池(没进白名单或被禁)→ 删除线
  document.body.className="l-"+list;
  const pc={},fc={};
  document.querySelectorAll(".h").forEach(b=>{
    const id=+b.dataset.id,h=byId.get(id),on=s.has(id),show=matches(h);
    b.classList.toggle("on",on); b.classList.toggle("x",mark.has(id)); b.classList.toggle("new",hasSaved&&!seen.has(id)); b.classList.toggle("hide",!show);
    b.classList.toggle("fol",list==="white"&&isFollow(h));
    const p=h.pack||h.genre||"其他",f=famOf(p);
    (pc[p]=pc[p]||[0,0,0])[0]+=on?1:0; pc[p][1]++; pc[p][2]+=show?1:0;
    (fc[f]=fc[f]||[0,0,0])[0]+=on?1:0; fc[f][1]++; fc[f][2]+=show?1:0;
  });
  document.querySelectorAll("[data-pcnt]").forEach(e=>{const c=pc[e.dataset.pcnt]||[0,0,0];e.innerHTML=`<b>${c[0]}</b> / ${c[1]}`;e.closest(".pack").classList.toggle("hide",c[2]===0);});
  document.querySelectorAll("[data-fcnt]").forEach(e=>{const c=fc[e.dataset.fcnt]||[0,0,0];e.innerHTML=`<b>${c[0]}</b> / ${c[1]}`;e.closest("details").classList.toggle("hide",c[2]===0);});
  // 顶栏
  $("#envs").innerHTML=KEYS.map(k=>{const c=CFG[k],inh=k!==DEF()&&!c.white.size;
    return `<button class="env${k===env?" on":""}" data-env="${esc(k)}">${esc(c.label||k)}<small>白 ${inh?"沿用军争":c.white.size} · 黑 ${c.ban.size} · 临 ${k!==DEF()&&!c.temp.size?"沿用":c.temp.size}</small></button>`;}).join("");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.list===list));
  const lab=esc(CFG[env].label||env);
  $("#count").innerHTML=`${lab} · ${list==="temp"?"临时 ban 池":(st?"套组「"+esc(st.name)+"」":CFG[env].sets.length?"默认":"")+(list==="white"?"白名单":"黑名单")} <span style="color:var(--seal)">${s.size}</span> 将`
    +(list==="white"&&s.size?` <span style="font-weight:400;font-size:12px;color:var(--soft)">· ${VIEW.groups.size} 个坑</span>`:"");
  // 套组栏:黑 / 白名单页、且该环境有自己的白名单时出现(沿用军争白名单的环境,套组也沿用军争的);临时 ban 池不分套
  const showSets=list!=="temp"&&(env===DEF()||CFG[env].white.size>0);
  $("#sets").classList.toggle("hide",!showSets); $("#f-diff").classList.toggle("hide",!st);
  if(showSets){ const c=CFG[env];
    $("#sets").innerHTML=`<span class="setl">套组</span><button class="setc${st?"":" on"}" data-set="">默认名单<small>白 ${c.white.size} · 黑 ${c.ban.size}</small></button>`
      +c.sets.map(x=>`<button class="setc${st&&x.id===st.id?" on":""}" data-set="${esc(x.id)}">${esc(x.name)}<small>白 ${x.white.size} · 黑 ${x.ban.size}</small></button>`).join("")
      +(c.sets.length<SET_MAX?`<button class="mini" data-setnew="1" title="把当前正在看的这一套黑白名单复制成一个新套组">＋ 新建套组</button>`:"")
      +(st?`<span class="grow"></span><button class="mini" data-setren="1">改名</button><button class="mini" data-setdel="1">删除</button>`:"");
  }
  let tip="";
  if(list==="white"){
    const FOL=`<span style="border:1px dashed var(--qi);border-radius:4px;padding:0 4px;color:var(--ink)">随</span>`, DEL=`<span style="text-decoration:line-through;text-decoration-color:var(--seal)">删除线</span>`;
    if(env!==DEF()&&!CFG[env].white.size) tip=`这个环境还没单独设白名单 → 发将时<b>沿用「${esc(CFG[DEF()].label)}」的 ${CFG[DEF()].white.size} 将</b>(套组也沿用它的)。想要专属将池就在下面勾选,或 <button class="mini" data-copydef="1">复制军争白名单过来再改</button>`;
    else if(st) tip=`套组「${esc(st.name)}」有<b>自己的一套黑白名单</b>,发将时在「发将设置」里选用;和默认名单、其它套组互不影响。`
      +`默认名单以后新加的武将<b>不会</b>自动进来 —— 点筛选「与默认不同」能看到两边的差别,顺手补勾。同名武将勾一个即可,${FOL}= 没勾但同名坑在池里,同样可选;想在这一套里单独去掉某个版本 → 切到「黑名单」页放进本套黑名单。带${DEL}的是本套黑名单里的将。`;
    else tip=`白名单 = 这个环境可以发的武将。同名武将勾一个即可(黄盖/界黄盖 算一个坑,任选其一):${FOL}就是没勾但会跟着同名坑一起可选的版本,想单独去掉它 → 进黑名单。`
      +`发将按「坑」等概率抽,同名版本再多也只算一个坑。带${DEL}的是本环境黑名单里的将。`
      +(CFG[env].sets.length?"":`想分「素将 / 荤将」几套 → 点上面「＋ 新建套组」,会把这套黑白名单复制一份出去单独改。`);
  } else if(list==="temp"){
    const n=effTemp(env).size, inh=env!==DEF()&&!s.size;
    tip=(inh?`这个环境没单独设 → 发将时<b>沿用「${esc(CFG[DEF()].label)}」的 ${CFG[DEF()].temp.size} 将</b>。`:"")
      +`临时 ban 池 = 出场太频繁、想压一压但又不想永久禁的强将。发将时勾「本局临时 ban」,每人从这里随机看 min(5, 池÷人数) 个,各 ban 一个(只 ban 那个版本,同名其它版本照常),本局不出现。<b>每人至少 3 选 1 才能开</b>:现在 ${n} 将,够 ${Math.floor(n/3)} 人局。带<span style="text-decoration:line-through;text-decoration-color:#6b4a86">删除线</span>的不在本环境将池里,勾了也不会抽到。`;
  } else if(st) tip=`套组「${esc(st.name)}」自己的黑名单:<b>只在线上发将选了这一套时生效</b>(发将不会发出这些版本;房内「禁将」开关关着则不禁),和默认黑名单互不影响。`
    +`房间里的「禁将池」面板、手动选将拦的仍是默认黑名单。<span style="border-bottom:1px dashed var(--ink);color:var(--ink)">虚线框</span>的是本套白名单里的将。`;
  else tip=`黑名单 = 当前环境禁用的强将:发将时不会发出,手动选将会被拒,房间里的「禁将池」展示的就是这份。<span style="border-bottom:1px dashed var(--ink);color:var(--ink)">虚线框</span>的是本环境将池里的将。`;
  $("#tip").innerHTML=tip;
  const d=dirty(); $("#dirty").textContent=d?"● 未保存":""; $("#b-save").disabled=!d;
}
// 批量(包/系列的 全选/清空):对当前正在看的那份名单(默认名单 / 某个套组 / 黑名单 / 临时 ban 池)
function setMany(ids,on){ const s=cur(); for(const id of ids){on?s.add(id):s.delete(id);} refresh(); }
const newSetId=()=>"s"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
function askSetName(def){
  const n=(prompt("套组名(最多 "+SET_NAME_MAX+" 个字),如:素将 / 荤将",def||"")||"").trim().slice(0,SET_NAME_MAX);
  if(!n)return null;
  if(CFG[env].sets.some(x=>x.name===n&&x.id!==(def&&setId))){toast("已经有同名套组了");return null;}
  return n;
}
const idsIn=(sel)=>[...document.querySelectorAll(sel+" .h:not(.hide)")].map(b=>+b.dataset.id); // 批量只动当前可见的(配合搜索/筛选)

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.classList.contains("h")){const id=+t.dataset.id,s=cur();s.has(id)?s.delete(id):s.add(id);refresh();return;}
  if(t.dataset.set!=null){setId=t.dataset.set;refresh();return;}
  if(t.dataset.setnew){if(CFG[env].sets.length>=SET_MAX){toast("每个环境最多 "+SET_MAX+" 套");return;}
    const st=curSet(),from=st?"「"+st.name+"」":"默认名单",src=st||CFG[env]; // 新套组 = 当前正在看的那一套黑白名单的拷贝
    const n=askSetName("");if(!n)return;const id=newSetId();CFG[env].sets.push({id,name:n,white:new Set(src.white),ban:new Set(src.ban)});setId=id;refresh();
    toast("已新建「"+n+"」:从"+from+"复制了白 "+src.white.size+" · 黑 "+src.ban.size+",之后各改各的");return;}
  if(t.dataset.setren){const st=curSet();if(!st)return;const n=askSetName(st.name);if(!n)return;st.name=n;refresh();return;}
  if(t.dataset.setdel){const st=curSet();if(!st)return;if(!confirm("删除套组「"+st.name+"」(白 "+st.white.size+" · 黑 "+st.ban.size+")?默认名单和其它套组不受影响;保存后生效。"))return;CFG[env].sets=CFG[env].sets.filter(x=>x!==st);setId="";refresh();return;}
  if(t.dataset.env){env=t.dataset.env;refresh();return;}
  if(t.dataset.list){list=t.dataset.list;refresh();return;}
  if(t.dataset.copydef){CFG[env].white=new Set(CFG[DEF()].white);refresh();toast("已复制,可以开始删改");return;}
  if(t.dataset.pall!=null){setMany(idsIn(`[data-pack="${CSS.escape(t.dataset.pall)}"]`),true);return;}
  if(t.dataset.pnone!=null){setMany(idsIn(`[data-pack="${CSS.escape(t.dataset.pnone)}"]`),false);return;}
  if(t.dataset.fall!=null){e.preventDefault();setMany(idsIn(`[data-fam="${CSS.escape(t.dataset.fall)}"]`),true);return;}
  if(t.dataset.fnone!=null){e.preventDefault();setMany(idsIn(`[data-fam="${CSS.escape(t.dataset.fnone)}"]`),false);return;}
  if(t.dataset.f){filter=t.dataset.f;document.querySelectorAll(".fl").forEach(b=>b.classList.toggle("on",b===t));refresh();return;}
});
$("#q").addEventListener("input",e=>{q=e.target.value.trim();refresh();});
const payload=()=>({pools:Object.fromEntries(KEYS.map(k=>[k,{white:sorted(CFG[k].white),ban:sorted(CFG[k].ban),temp:sorted(CFG[k].temp),sets:setsOut(k)}]))});
$("#b-save").onclick=async()=>{
  $("#b-save").disabled=true;
  try{
    const r=await fetch("/api/pool",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({...payload(),seen:HEROES.map(h=>h.id)})});
    const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||r.status);
    savedSnap=snap();seen=new Set(HEROES.map(h=>h.id));hasSaved=true;refresh();toast("已保存 · 房间立即生效");
  }catch(err){toast("保存失败:"+err.message);refresh();}
};
$("#b-exp").onclick=()=>{const x=$("#exp");x.style.display=x.style.display==="block"?"none":"block";x.querySelector("textarea").value=JSON.stringify(payload());};
$("#b-copy").onclick=()=>{const ta=$("#exp textarea");ta.select();try{navigator.clipboard.writeText(ta.value);toast("已复制");}catch{document.execCommand("copy");toast("已复制");}};
window.addEventListener("beforeunload",e=>{if(dirty()){e.preventDefault();e.returnValue="";}});

(async()=>{
  try{
    const [g,p]=await Promise.all([fetch("/generals.json",{cache:"no-store"}).then(r=>r.json()),fetch("/api/pool",{cache:"no-store"}).then(r=>r.json())]);
    HEROES=g; const valid=new Set(g.map(h=>h.id));
    KEYS=Object.keys(p.pools||{}); env=KEYS[0];
    for(const k of KEYS) CFG[k]={label:p.pools[k].label,white:new Set((p.pools[k].white||[]).filter(i=>valid.has(i))),ban:new Set((p.pools[k].ban||[]).filter(i=>valid.has(i))),temp:new Set((p.pools[k].temp||[]).filter(i=>valid.has(i))),
      sets:(p.pools[k].sets||[]).map(s=>({id:String(s.id),name:String(s.name),white:new Set((s.white||[]).filter(i=>valid.has(i))),ban:new Set((s.ban||[]).filter(i=>valid.has(i)))}))};
    seen=new Set(p.seen||[]); hasSaved=!!p.updatedAt&&seen.size>0; // 从未保存过时不标「新」
    savedSnap=snap();
    build();
  }catch(err){$("#count").textContent="加载失败:"+err.message;}
})();
</script>
</body>
