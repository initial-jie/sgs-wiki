<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ede4d0">
<title>游戏大厅 · 桌游房间</title>
<!-- 游戏大厅:所有房间/站点的统一入口。游戏清单来自 prototype/common/games.mjs(worker 下发时替换 /*GAMES*/ 占位),
     本机最近去过的房间来自 localStorage rooms_recent(room-client.js 连上房间时记录)。搜索:名字包含 / 别名 / 英文 / 拼音(RoomClient.searchRank)。 -->
<style>
:root{
  --paper:#ede4d0; --paper2:#f6efdf; --paper3:#e3d7bd;
  --ink:#26211a; --ink-soft:#5a5142; --seal:#a32e22; --line:rgba(70,55,30,.22);
  --body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;padding:16px 16px 60px;max-width:560px;margin:0 auto;
  background-image:radial-gradient(ellipse at top,rgba(255,255,255,.5),transparent 60%)}
h1{font-size:24px;margin:6px 0 2px;letter-spacing:.04em}
h1 small{font-size:13px;font-weight:400;color:var(--ink-soft);margin-left:8px}
.sub{color:var(--ink-soft);font-size:13px;margin:0 0 14px}
.search{position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0 10px;margin:0 -2px}
.search input{width:100%;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper2);color:var(--ink);outline:none;font-family:inherit}
.search input:focus{border-color:var(--seal);box-shadow:0 0 0 3px rgba(163,46,34,.12)}
.search .hint{font-size:12px;color:var(--ink-soft);margin:6px 2px 0}
.sec{font-size:13px;color:var(--ink-soft);margin:16px 2px 8px;letter-spacing:.08em}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.recent a b{font-variant-numeric:tabular-nums;color:var(--seal)}
.recent a small{color:var(--ink-soft);font-size:12px}
.recent .clr{background:transparent;border-style:dashed;color:var(--ink-soft);cursor:pointer;font:inherit;font-size:13px}
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--paper2);border:1px solid var(--line);text-decoration:none;color:var(--ink);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 18px -14px rgba(0,0,0,.35);transition:transform .08s,border-color .12s}
.card:active{transform:scale(.985)}
.card.hit{border-color:var(--seal)}
.card .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--paper3);border:1px solid var(--line)}
.card .nm{font-size:17px;font-weight:700;line-height:1.3}
.card .nm small{font-weight:400;color:var(--ink-soft);font-size:12px;margin-left:6px}
.card .tg{font-size:13px;color:var(--seal);margin-top:1px}
.card .ds{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
.card .go{font-size:13px;color:var(--seal);white-space:nowrap;align-self:center}
.card.ext .go{color:var(--ink-soft)}
.empty{padding:26px 10px;text-align:center;color:var(--ink-soft);font-size:14px}
footer{margin-top:26px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.8}
footer a{color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<h1>🎲 游戏大厅<small>GAME HUB</small></h1>
<p class="sub">所有房间一个入口。手机口报 4 位房间码即可同桌;同一台手机在各游戏里是同一个名字。</p>
<div class="search"><input id="q" type="search" placeholder="搜游戏:狼人 / fs / sanguosha / 风声…(回车进第一个)" autocomplete="off" autofocus><div class="hint" id="qhint">支持中文、英文、拼音和缩写</div></div>
<div id="recentWrap" hidden><div class="sec">最近去过的房间</div><div class="recent" id="recent"></div></div>
<div class="sec" id="listTitle">全部游戏</div>
<div class="cards" id="cards"></div>
<footer>同一套服务;房间码按游戏各自独立 · <a href="https://github.com/initial-jie/sgs-wiki" target="_blank" rel="noopener">源码</a></footer>
<div class="toast" id="toast"></div>
<script src="/common/room-client.js"></script>
<script>
const GAMES=/*GAMES*/[]/*/GAMES*/;
const {esc,lsGet,lsSet,searchRank,$}=RoomClient;
const byKey=Object.fromEntries(GAMES.map(g=>[g.key,g]));
const params=new URLSearchParams(location.search);

// 排名:名字/别名/英文包含 → 0..2;拼音(searchRank)→ 10+;不匹配 -1
function rank(g,q){
  const qs=q.trim(); if(!qs) return 0;
  const ql=qs.toLowerCase();
  if(g.name.includes(qs)) return g.name.startsWith(qs)?0:1;
  if((g.aliases||[]).some(a=>a.toLowerCase()===ql)) return 0;
  if((g.aliases||[]).some(a=>a.toLowerCase().includes(ql))) return 2;
  if((g.en||"").toLowerCase().includes(ql)) return 3;
  const r=searchRank(g,qs); return r<0?-1:10+r;
}
function matches(q){ return GAMES.map((g,i)=>[g,rank(g,q),i]).filter(x=>x[1]>=0).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(x=>x[0]); }
function href(g,code){ if(g.external) return g.path; return code?g.path+(g.path.includes("?")?"&":"?")+"code="+code:g.path; }
function card(g,hit){
  return `<a class="card${g.external?" ext":""}${hit?" hit":""}" href="${esc(href(g))}" ${g.external?'target="_blank" rel="noopener"':""} data-key="${esc(g.key)}">
    <div class="ic" style="${g.color?"box-shadow:inset 0 0 0 2px "+esc(g.color)+"33":""}">${g.icon||"🎮"}</div>
    <div><div class="nm">${esc(g.name)}${g.en?`<small>${esc(g.en)}</small>`:""}</div><div class="tg">${esc(g.tag||"")}${g.players?" · "+esc(g.players):""}</div><div class="ds">${esc(g.desc||"")}</div></div>
    <div class="go">${g.external?"打开 ↗":"进入 →"}</div></a>`;
}
function ago(t){ const s=Math.max(0,(Date.now()-t)/1000); if(s<60) return "刚刚"; if(s<3600) return Math.floor(s/60)+" 分钟前"; if(s<86400) return Math.floor(s/3600)+" 小时前"; return Math.floor(s/86400)+" 天前"; }
function recent(){ try{ const a=JSON.parse(lsGet("rooms_recent")||"[]"); return Array.isArray(a)?a.filter(r=>byKey[r.key]&&/^\d{4}$/.test(r.code)):[]; }catch(e){ return []; } }
function renderRecent(){
  const rs=recent().filter(r=>Date.now()-r.at<7*86400e3); const w=$("#recentWrap"); if(!rs.length){ w.hidden=true; return; } w.hidden=false;
  $("#recent").innerHTML=rs.map(r=>{ const g=byKey[r.key]; return `<a href="${esc(href(g,r.code))}">${g.icon||""} ${esc(g.name)} <b>${esc(r.code)}</b><small>${ago(r.at)}</small></a>`; }).join("")+`<button class="clr" id="clrRecent">清除</button>`;
  $("#clrRecent").onclick=()=>{ lsSet("rooms_recent","[]"); renderRecent(); RoomClient.toast("已清除"); };
}
function render(){
  const q=$("#q").value; const ms=matches(q);
  $("#listTitle").textContent=q.trim()?(ms.length?`匹配 ${ms.length} 个`:"没有匹配"):"全部游戏";
  $("#cards").innerHTML=ms.length?ms.map((g,i)=>card(g,q.trim()&&i===0)).join(""):`<div class="empty">没找到「${esc(q)}」。试试拼音首字母,如 lr(狼人)、fs(风声)。</div>`;
  $("#qhint").textContent=q.trim()&&ms.length?"回车进入「"+ms[0].name+"」":"支持中文、英文、拼音和缩写";
}
$("#q").addEventListener("input",render);
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const ms=matches($("#q").value); if(ms[0]){ const g=ms[0]; if(g.external) window.open(g.path,"_blank"); else location.href=href(g); } } if(e.key==="Escape"){ $("#q").value=""; render(); } });
if(params.get("q")) $("#q").value=params.get("q");
renderRecent(); render();
</script>
</body>
</html>
