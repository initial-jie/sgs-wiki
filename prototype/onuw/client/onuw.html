<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>一夜终极狼人房间</title>
<style>
/* 月夜:深靛蓝底 + 月光米白 + 血红/松绿/琥珀。阵营色:村民 蓝 / 狼人 红 / 皮匠 琥珀 */
:root{
  --bg:#0d1020; --bg2:#161a30; --card:rgba(22,26,48,.94); --line:rgba(190,200,255,.18);
  --fg:#eef0ff; --fg-soft:#9aa3c7; --moon:#f3e9c6; --red:#ff5a4e; --blue:#5aa9ff; --amber:#e8b84a; --green:#58d68d;
  --village:#5aa9ff; --werewolf:#ff5a4e; --tanner:#e8b84a; --vampire:#c084fc; --indep:#8fd3c8;
  --body:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:radial-gradient(circle at 85% -5%,rgba(243,233,198,.14),transparent 40%),radial-gradient(circle at 10% 110%,rgba(90,169,255,.1),transparent 45%);
  color:var(--fg);font-family:var(--body);line-height:1.6;padding:12px 16px 60px;max-width:560px;margin:0 auto}
body.day{background-image:radial-gradient(circle at 85% -5%,rgba(255,220,120,.32),transparent 45%),radial-gradient(circle at 10% 110%,rgba(255,170,90,.14),transparent 45%)}
h1{font-weight:900;font-size:22px;letter-spacing:.18em;text-align:center;margin:4px 0 0;color:var(--moon);text-shadow:0 0 14px rgba(243,233,198,.45)}
h1 .st{display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--red);border:2px solid var(--red);border-radius:4px;padding:0 5px;margin-left:6px;transform:rotate(-8deg);vertical-align:middle;font-weight:700;text-shadow:none}
.sub{text-align:center;color:var(--fg-soft);font-size:12px;letter-spacing:.14em;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--moon);border-radius:10px;padding:12px 14px;margin-bottom:11px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card.secret{border-left-color:var(--red)}
.card.day{border-left-color:var(--amber)}
.card h2{font-weight:900;font-size:16px;letter-spacing:.08em;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:10px;color:#fff}
.card h2 .tag{float:right;font-size:11px;color:var(--fg-soft);letter-spacing:0;font-weight:400}
label{font-size:13px;color:var(--fg-soft)}
input,select{font-family:inherit;font-size:14px;background:#0a0d1a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
select option{background:#0a0d1a}
button{font-family:inherit;font-size:14px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:8px 12px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--moon);border-color:var(--moon);color:#1a1405;font-weight:700}
button.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
button.warn{background:var(--amber);border-color:var(--amber);color:#211a00;font-weight:700}
button.ghost{background:transparent;color:var(--fg-soft)}
button.sm{font-size:12px;padding:4px 9px}
button.xs{font-size:12px;padding:2px 7px;line-height:1.4}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--fg-soft);margin-top:6px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--fg-soft)}
a{color:var(--blue)}
#connbar{display:none;position:fixed;left:0;right:0;top:0;z-index:9999;align-items:center;justify-content:center;gap:12px;padding:9px 14px;background:var(--red);color:#fff;font-size:13px;font-weight:600}
#connbar button{background:#fff;color:var(--red);border:none;padding:5px 14px;font-weight:700}
body.disconnected #connbar{display:flex}
body.disconnected #app{opacity:.5;pointer-events:none;filter:grayscale(.35)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#1a1405;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:10000;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.topbar{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.topbar .who{font-size:12px;color:var(--fg-soft)}

/* 阵营 / 角色 */
.tm{display:inline-block;font-weight:700;border-radius:4px;padding:0 7px;color:#fff;font-size:12px}
.tm.village{background:var(--village)} .tm.werewolf{background:var(--werewolf)} .tm.tanner{background:var(--tanner);color:#1a1405} .tm.vampire{background:var(--vampire)} .tm.indep{background:var(--indep);color:#0d1020}
.rimg{width:44px;height:60px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#0a0d1a;flex:none}
.rimg.big{width:64px;height:88px}
.pc.face img.cimg,.cc.face img.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:5px;opacity:.9}
.pc.face .fx,.cc.face .fx{position:relative;z-index:1;text-shadow:0 1px 3px #000,0 0 6px #000}
.mini img.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:3px;opacity:.85}
.mini{position:relative;overflow:hidden} .mini .fx{position:relative;z-index:1;text-shadow:0 1px 3px #000}
.mini.mark{border-style:dashed;border-color:var(--amber)}
.rolebig{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(10,13,26,.6);margin-bottom:8px}
.rolebig .ic{font-size:40px;line-height:1}
.rolebig .rn{font-weight:900;font-size:22px;letter-spacing:.1em;color:#fff}
.rolebig .re{font-size:12px;color:var(--fg-soft)}
.rolebig.village{border-color:rgba(90,169,255,.5)} .rolebig.werewolf{border-color:rgba(255,90,78,.6)} .rolebig.tanner{border-color:rgba(232,184,74,.6)} .rolebig.vampire{border-color:rgba(192,132,252,.6)} .rolebig.indep{border-color:rgba(143,211,200,.6)}

/* 圆桌 */
.table{position:relative;width:min(92vw,440px);aspect-ratio:1;margin:6px auto 4px}
.pc{position:absolute;width:58px;height:80px;margin-left:-29px;margin-top:-40px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:repeating-linear-gradient(135deg,#2a2f55 0 5px,#20243f 5px 10px);border:2px solid #4a5290;box-shadow:0 4px 10px rgba(0,0,0,.45);color:#fff;transition:transform .15s,box-shadow .15s}
.pc .no{font-weight:900;font-size:22px;line-height:1.1;text-shadow:0 1px 3px #000}
.pc .nm{font-size:10px;color:#cfd6ff;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;padding:0 2px}
.pc.mine{border-color:var(--moon);box-shadow:0 0 0 2px rgba(243,233,198,.35),0 4px 10px rgba(0,0,0,.45)}
.pc.sel{transform:scale(1.1);border-color:var(--blue);box-shadow:0 0 0 3px rgba(90,169,255,.5)}
.pc.selectable{animation:glow 1.3s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(90,169,255,.35),0 4px 10px rgba(0,0,0,.45)}}
.pc.dim{opacity:.45;cursor:default}
.pc.speaker{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,184,74,.5)}
.pc.face{background:#1c2140;border-color:#8c93c9}
.pc.face.village{border-color:var(--village)} .pc.face.werewolf{border-color:var(--werewolf)} .pc.face.tanner{border-color:var(--tanner)} .pc.face.vampire{border-color:var(--vampire)} .pc.face.indep{border-color:var(--indep)}
.pc .bd3{position:absolute;bottom:-7px;right:-7px;font-size:12px;background:#0d1020;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--amber)}
.pc .mk{font-size:9px;color:var(--amber);line-height:1}
.pc.face .ic{font-size:24px;line-height:1.1}
.pc.face .rn{font-size:11px;font-weight:700;color:#fff}
.pc.dead{filter:grayscale(.7)}
.pc .bd{position:absolute;top:-7px;right:-7px;font-size:13px;background:#0d1020;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.pc .bd2{position:absolute;top:-7px;left:-7px;font-size:12px;background:#0d1020;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.pc .mic{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:12px;background:var(--amber);color:#1a1405;border-radius:10px;padding:0 6px;font-weight:700;line-height:1.4}
.pc .dead-x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--red);text-shadow:0 0 6px #000}
.table.big .pc{width:48px;height:66px;margin-left:-24px;margin-top:-33px} .table.big .pc .no{font-size:18px} .table.big .pc .nm{font-size:9px;max-width:44px}
.table.huge .pc{width:42px;height:58px;margin-left:-21px;margin-top:-29px} .table.huge .pc .no{font-size:16px} .table.huge .pc .nm{font-size:8px;max-width:38px} .table.huge .pc.face .ic{font-size:18px} .table.huge .pc.face .rn{font-size:9px}
.table.big .cc{width:36px;height:50px} .table.big .cc.h{width:50px;height:36px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.center .rowc{display:flex;gap:6px}
.cc{width:42px;height:58px;border-radius:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#2a2f55 0 4px,#20243f 4px 8px);border:2px solid #4a5290;color:#aeb6e8;font-size:10px;position:relative}
.cc.h{width:58px;height:42px}
.cc.sel{transform:scale(1.1);border-color:var(--blue);box-shadow:0 0 0 3px rgba(90,169,255,.5)}
.cc.selectable{animation:glow 1.3s infinite}
.cc.face{background:#1c2140;border-color:#8c93c9} .cc.face .ic{font-size:18px;line-height:1} .cc.face .rn{font-size:9px;font-weight:700;color:#fff}
.cc.face.village{border-color:var(--village)} .cc.face.werewolf{border-color:var(--werewolf)} .cc.face.tanner{border-color:var(--tanner)} .cc.face.vampire{border-color:var(--vampire)} .cc.face.indep{border-color:var(--indep)}
.banner{text-align:center;border-radius:10px;padding:8px 12px;margin-bottom:8px;border:1px solid var(--line);background:rgba(10,13,26,.7)}
.banner .ph{font-size:12px;letter-spacing:.2em;color:var(--fg-soft)}
.banner .big{font-size:20px;font-weight:900;letter-spacing:.1em;color:#fff}
.banner .cd{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--moon)}
.banner.night{border-color:rgba(243,233,198,.35)} .banner.dusk{border-color:rgba(192,132,252,.5);background:rgba(192,132,252,.08)} .banner.day{border-color:rgba(232,184,74,.5);background:rgba(232,184,74,.1)} .banner.vote{border-color:rgba(255,90,78,.5);background:rgba(255,90,78,.08)}
.banner .cd.low{color:var(--red)}
.steps{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.steps i{display:inline-block;width:14px;height:5px;border-radius:3px;background:#2a2f55}
.steps i.done{background:var(--fg-soft)} .steps i.cur{background:var(--moon)}
.act{border:1px solid rgba(90,169,255,.5);border-radius:10px;padding:10px 12px;background:rgba(90,169,255,.07);margin-bottom:8px}
.act .ti{font-weight:800;font-size:15px;color:#fff;margin-bottom:4px}
.act .tp{font-size:13px;color:var(--fg)}
.act .sel-info{font-size:13px;color:var(--blue);margin:6px 0}
.notes{font-size:13px}
.note{border-left:3px solid var(--line);padding:4px 10px;margin:5px 0;background:rgba(10,13,26,.5);border-radius:0 6px 6px 0}
.note.latest{border-left-color:var(--moon)}
.note .np{font-size:11px;color:var(--fg-soft)}
.note .ncards{display:flex;gap:6px;margin-top:4px}
.mini{width:40px;height:54px;border-radius:5px;border:2px solid #8c93c9;background:#1c2140;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700;text-align:center;line-height:1.1}
.mini .ic{font-size:17px;line-height:1.1;margin-bottom:2px}
.mini.village{border-color:var(--village)} .mini.werewolf{border-color:var(--werewolf)} .mini.tanner{border-color:var(--tanner)} .mini.vampire{border-color:var(--vampire)} .mini.indep{border-color:var(--indep)}
.rgrid h4{grid-column:1/-1;font-size:12px;letter-spacing:.15em;color:var(--fg-soft);margin:6px 0 0}
.mini .tt{font-size:8px;color:var(--fg-soft);font-weight:400}
.seats-setup .seat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:rgba(10,13,26,.5);display:flex;align-items:center;gap:8px}
.seats-setup .seat.mine{border-color:var(--moon);background:rgba(243,233,198,.07)}
.seats-setup .st{font-weight:900;font-size:16px}
.seats-setup .who{font-size:12px;color:var(--fg-soft)}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.rrow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:rgba(10,13,26,.5)}
.rrow.on{border-color:rgba(243,233,198,.5);background:rgba(243,233,198,.07)}
.rrow .ic{font-size:20px;line-height:1}
.rrow .th{width:34px;height:34px;border-radius:6px;object-fit:cover;object-position:50% 28%;border:1px solid var(--line);background:#0a0d1a;flex:none}
.rrow .rn{font-weight:700;font-size:13px;color:#fff;cursor:pointer}
.rrow .ro{font-size:10px;color:var(--fg-soft)}
.rrow .cnt{font-family:var(--mono);font-weight:700;min-width:14px;text-align:center}
.rrow button{padding:2px 7px;font-size:14px;line-height:1.2}
.deckbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.deckbar b{font-size:18px}
.deckbar.ok b{color:var(--green)} .deckbar.bad b{color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button.on{background:var(--moon);color:#1a1405;border-color:var(--moon)}
.mask{position:fixed;inset:0;background:rgba(5,6,16,.78);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:34px 10px;overflow:auto}
.sheet{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--moon);border-radius:11px;width:100%;max-width:520px;padding:14px 15px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.sheet h2{font-weight:900;font-size:17px;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:#fff}
.sheet h2 .x{margin-left:auto;font-size:20px;line-height:1;color:var(--fg-soft);cursor:pointer;padding:0 4px}
.codex .ce{display:flex;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.codex .ce .ic{font-size:28px;line-height:1.2;flex:none;width:36px;text-align:center}
.codex .ce .cn{font-weight:800;font-size:15px;color:#fff}
.codex .ce .cm{font-size:11px;color:var(--fg-soft)}
.codex .ce .cd{font-size:13px;margin-top:2px}
.codex h3{font-size:13px;letter-spacing:.15em;color:var(--fg-soft);margin:10px 0 2px}
.result{border-left-color:var(--amber);background:rgba(232,184,74,.08)}
.result .big{font-weight:900;font-size:22px;text-align:center;letter-spacing:.15em;color:var(--amber);margin-bottom:6px}
.result .ln{font-size:13px;margin:3px 0}
.vt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.vt td{padding:3px 6px;border-bottom:1px dotted var(--line)}
.log{font-size:12px;color:var(--fg-soft);max-height:220px;overflow:auto;font-family:var(--mono)}
.log div{padding:2px 0;border-bottom:1px dotted var(--line)}
details summary{cursor:pointer;font-size:13px;color:var(--fg-soft)}
footer{text-align:center;font-size:11px;color:var(--fg-soft);margin-top:18px;letter-spacing:.1em}
.num{width:64px;text-align:center}
.cfg label{display:block;margin-top:6px}
.cfg .inl{display:inline-flex;align-items:center;gap:6px}
.cfg .inl input{width:72px;text-align:center}
.rounds .rd{display:flex;align-items:center;gap:6px;margin:4px 0}
.rounds .rd b{font-family:var(--mono)}
</style>
</head>
<body>
<div id="connbar"><span>⚠ 连接已断开,正在重连…操作已暂停</span><button id="rcNow" type="button">立即重连</button></div>
<div id="app"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script src="/common/room-client.js"></script><!-- 公共房间客户端(连接/重连/改名/toast);见 prototype/common/client/ -->
<script>
/* 一夜终极狼人房间:系统发牌 + 语音播报夜晚顺序 + 行动在 UI 里完成 + 多轮发言 + 限时投票 + 自动结算。
   权威逻辑在 DO(prototype/onuw/shared/onuw-logic.mjs);这里只渲染 roomState、发 action{op,…} 与到点 tick。 */
const {esc,toast,$}=RoomClient;
let state=null, DATA=null, R={}, ART={}, MK={};
let mmMode="card", grWhat="cards";   // 神射手当前点选模式(card|mark)/ 小精灵换牌或换印记
let clockOffset=0;                 // serverNow - Date.now()
let actSeat=null;                  // 多座位代持时当前操作的座位
let sel={seats:[],center:[]};      // 当前行动的选牌
let voteSel=null;                  // 投票选中的目标
let narrOn=RoomClient.lsGet("onuw_narr")==="1"; // 本机是否语音播报
let lastNarr=null, lastTickAt=0;

const RC=RoomClient.create({
  wsPath: code=>"/api/onuw/"+code+"/ws",
  errorText:{NOT_SETUP:"对局已开始,不能改设置/座位",DECK_SIZE:"牌数必须等于 人数+3",ROLE_MAX:"该角色数量超过上限",BAD_ROLES:"角色配置不合法",BAD_CONFIG:"配置不合法",TOO_FEW_PLAYERS:"至少 3 名玩家",
    NOT_NIGHT:"现在不是夜晚",NOT_ACTOR:"这个阶段不轮到你",ALREADY_ACTED:"你已经行动过了",SELF_TARGET:"不能选自己",SHIELDED:"这张牌被护盾保护,不能动",MANDATORY:"这个行动必须执行,不能跳过",BAD_TARGET:"目标不合法",BAD_KIND:"现在不能做这个操作",
    NOT_LONE:"你不是唯一的狼人,不能看中央牌",NO_WOLF_CARD:"没有中央狼人牌",TARGET_IS_WOLF:"不能换给狼人同伴",HAS_ARTIFACT:"这名玩家已经有神器了",NO_ACTION:"这个角色没有夜晚行动",
    NOT_NARRATOR:"只有播报员设备能回报播报完成",NOT_DAY:"现在不是白天",NOT_SPEAKER:"还没轮到你发言",NOT_YET:"讨论时间还没到",NOT_VOTE:"现在不是投票时间",TARGET_IS_VAMP:"不能给吸血鬼放印记",NOT_ADJACENT:"病患只能放给左右邻座"},
  beforeConnect(){ state=null; closeModal(); sel={seats:[],center:[]}; voteSel=null; lastNarr=null; },
  onState(m){ const prev=state; state=m; clockOffset=(m.serverNow||Date.now())-Date.now(); afterState(prev); autoSeat(); render(); },
  onMessage(){},
  onClosed(){ state=null; closeModal(); render(); },
  onRenamed(){ render(); },
});
function act(op,extra){ return RC.send(Object.assign({type:"action",op},extra||{})); }

fetch("/onuw/data.json?v=__ONUW_DATA_VER__").then(r=>r.json()).then(d=>{ DATA=d; R=Object.fromEntries(d.roles.map(r=>[r.key,r])); ART=Object.fromEntries(d.artifacts.map(a=>[a.key,a])); MK=Object.fromEntries((d.marks||[]).map(m=>[m.key,m])); render(); }).catch(()=>toast("角色数据加载失败,刷新重试"));

/* ============ 小工具 ============ */
const sNow=()=>Date.now()+clockOffset;
const seatsArr=()=>Object.values(state.seats).sort((a,b)=>a.seatNo-b.seatNo);
const mySeats=()=>state.youHold.slice().sort((a,b)=>a-b);
const rn=k=>R[k]?R[k].name:(k||"?");
const ric=k=>R[k]?R[k].icon:"❔";
const rteam=k=>k==="pi"||k==="doppelganger"||k==="copycat"||k==="nostradamus"?"village":(R[k]?R[k].team:"village");

let voice=null;
// 音色偏好:本机存 onuw_voice {name,rate,pitch};没存则按"增强/自然音 > 微软云希/云扬 > Google > 婷婷"挑
function voicePref(){ try{ return JSON.parse(RoomClient.lsGet("onuw_voice")||"{}"); }catch(e){ return {}; } }
function saveVoicePref(p){ RoomClient.lsSet("onuw_voice",JSON.stringify(p)); }
function zhVoices(){ if(!("speechSynthesis" in window)) return []; const vs=speechSynthesis.getVoices(); return vs.filter(v=>/^zh/i.test(v.lang)).concat(vs.filter(v=>!/^zh/i.test(v.lang))); }
function pickVoice(){ if(!("speechSynthesis" in window)) return; const vs=speechSynthesis.getVoices(), pref=voicePref();
  voice=(pref.name&&vs.find(v=>v.name===pref.name))
    ||vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/Enhanced|Premium|增强|Natural|Yunxi|Yunyang|Yunjian|云希|云扬/i.test(v.name))
    ||vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/Google|Xiaoxiao|晓晓/i.test(v.name))
    ||vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/Tingting|婷婷/i.test(v.name))
    ||vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
// speak(text,cancel,onDone):念完(或出错/不可用)回调 onDone;没开播报也立刻回调
function speak(text,cancel,onDone){
  if(!narrOn||!text||!("speechSynthesis" in window)){ onDone&&onDone(); return; }
  if(cancel) speechSynthesis.cancel();
  const pref=voicePref(); const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN"; u.rate=pref.rate||0.95; u.pitch=pref.pitch||0.9; if(voice) u.voice=voice;
  let fired=false; const fin=()=>{ if(fired) return; fired=true; clearTimeout(tm); onDone&&onDone(); };
  u.onend=fin; u.onerror=fin; const tm=setTimeout(fin,Math.min(60000,4000+text.length*350)); // 兜底:有的浏览器不触发 onend
  speechSynthesis.speak(u);
}

    <div class="row" style="margin-top:10px"><label>语速 <b id="vc-rate-v">${pref.rate||0.95}</b></label><input type="range" id="vc-rate" min="0.6" max="1.4" step="0.05" value="${pref.rate||0.95}" class="grow"></div>
    <div class="row" style="margin-top:6px"><label>音调 <b id="vc-pitch-v">${pref.pitch||0.9}</b></label><input type="range" id="vc-pitch" min="0.5" max="1.4" step="0.05" value="${pref.pitch||0.9}" class="grow"></div>

let actx=null;
function ding(){ if(!narrOn) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.value=.001; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6); o.stop(actx.currentTime+.65);}catch(e){} }
function setNarr(on){ narrOn=on; RoomClient.lsSet("onuw_narr",on?"1":"0"); if(on){ try{ speechSynthesis.cancel(); speak("语音播报已开启",true);}catch(e){} if(state&&RC.connected) act("setNarrator"); } else { try{speechSynthesis.cancel();}catch(e){} } render(); }
const isNarrator=()=>state&&state.narrator===RC.deviceId;
// 状态变化 → 该播什么(只播一次;所有设备算出同样的 key,只有开了播报的设备出声)
function afterState(prev){
  if(!state||!DATA) return;
  let key=null, text=null;
  if(state.phase==="night"&&state.night){
    const n=state.night, role=n.role; key="n"+n.idx;
    if(key!==lastNarr){
      const prevRole=n.idx>0?n.phases[n.idx-1]:null;
      const firstNight=n.idx>0&&!n.dusk&&R[n.phases[n.idx-1]].order<0; // 黄昏结束进入夜晚
      const withEn=(r,t)=>t.replace(r.name,r.name+" "+r.en); // 播报里带上英文名(大家习惯英文称呼)
      text=(n.idx===0?(n.dusk?DATA.narr.duskStart:DATA.narr.nightStart)+" ":"")+(prevRole&&R[prevRole].narr?withEn(R[prevRole],R[prevRole].narr.close)+" ":"")+(firstNight?DATA.narr.nightStart+" ":"")+(R[role].narr?withEn(R[role],R[role].narr.open):"");
    }
  } else if(state.phase==="day"&&state.day){
    const d=state.day; key=`d${d.round}-${d.cur}`;
    if(key!==lastNarr){
      const parts=[];
      if(lastNarr&&lastNarr[0]==="n"){ const ph=prev&&prev.night&&prev.night.role; if(ph&&R[ph]&&R[ph].narr) parts.push(R[ph].narr.close); parts.push(DATA.narr.nightEnd); }
      if(d.round===0&&d.cur===0&&state.dayNotice) parts.push(state.dayNotice+"。");
      if(!lastNarr||!lastNarr.startsWith(`d${d.round}-`)) parts.push(d.mode==="order"?`第${d.round+1}轮顺序发言,从${d.order[0]}号开始。`:`第${d.round+1}轮自由讨论,${Math.round(d.freeMs/60000)}分钟。`);
      if(d.mode==="order"&&d.speaker!=null){ if(d.anchorSeat!=null&&d.cur===d.order.length-1) parts.push(`所有人发言完毕,由${d.anchorSeat}号归票沉底发言。`); else parts.push(`请${d.speaker}号发言。`); }
      text=parts.join(" ");
    }
  } else if(state.phase==="vote"){ key="v"; if(key!==lastNarr) text=`讨论结束,请投票。${state.config.voteSec}秒内点选你要出局的玩家。`; }
  else if(state.phase==="over"&&state.result){ key="o"; if(key!==lastNarr){ const r=state.result; text=DATA.narr.voteClosed+" "+(r.deaths.length?r.deaths.map(n=>`${n}号,${rn(r.final[n])}`).join(";")+"出局。":"无人出局。")+" "+r.lines[0]; } }
  else key=state.phase;
  if(key!==lastNarr){ lastNarr=key;
    const nightIdx=state.phase==="night"?state.night.idx:null;
    const done=()=>{ if(nightIdx!=null&&isNarrator()&&state&&state.phase==="night"&&state.night.idx===nightIdx&&state.night.narrDoneAt==null) act("narrDone",{idx:nightIdx}); };
    if(text){ ding(); speak(text,true,done); } else done();
    sel={seats:[],center:[]}; mmMode="card"; grWhat="cards"; autoSeat();
  }
}
// 一台手机代持多个座位时,自动切到"该行动/该投票"的座位,不用手点 tab
function autoSeat(){
  const ms=mySeats(); if(ms.length<2) return;
  if(state.phase==="night"&&state.night){ const cur=state.night.me[actSeat]; if(cur&&!cur.acted) return; const n=ms.find(x=>state.night.me[x]&&!state.night.me[x].acted); if(n!=null){ actSeat=n; sel={seats:[],center:[]}; } }
  else if(state.phase==="vote"){ if(actSeat!=null&&!state.seats[actSeat].hasVoted) return; const n=ms.find(x=>!state.seats[x].hasVoted); if(n!=null){ actSeat=n; voteSel=null; } }
}

/* ============ 到点 tick(幂等,服务端校验)============ */
function deadline(){ // 返回当前阶段的截止时刻(毫秒,服务端时钟)或 null
  if(!state) return null; const c=state.config;
  if(state.phase==="night"&&state.night) return state.night.narrDoneAt!=null?state.night.narrDoneAt+c.phaseSec*1000:state.night.startedAt+45000; // 播报念完才开始计时;播报员失联 45s 兜底
  if(state.phase==="day"&&state.day){ const d=state.day; if(d.mode==="order") return c.perSpeakSec>0?d.speakerStartedAt+c.perSpeakSec*1000:null; return d.startedAt+d.freeMs; }
  if(state.phase==="vote"&&state.voting) return state.voting.startedAt+c.voteSec*1000;
  return null;
}
setInterval(()=>{
  if(!state) return;
  const dl=deadline(); const el=$("#cd");
  const narrating=state.phase==="night"&&state.night&&state.night.narrDoneAt==null;
  if(dl!=null){ const rem=dl-sNow(); if(el){ el.textContent=narrating?"🔊 播报中…":(rem>0?fmt(rem):(state.phase==="night"?"…":"0")); el.classList.toggle("low",!narrating&&rem>0&&rem<=10000); }
    if(rem<=0&&Date.now()-lastTickAt>2000&&RC.connected){ lastTickAt=Date.now(); RC.ws&&RC.ws.readyState===1&&RC.ws.send(JSON.stringify({type:"tick"})); } }
  else if(el) el.textContent="";
},400);

    <div class="row" style="margin-top:6px"><span class="inl"><label>投票时限</label><input class="num" type="number" id="cf-voteSec" value="${c.voteSec}" min="10" max="600"><label>秒(超时=弃票)</label></span></div>
    <div class="hint">每轮顺序发言随机选一人开始,依次顺时针;本机改动即时同步给全房。</div></div>`;

  return h;
}

}

// 当前行动需要我点什么:返回 {seats:n|0, center:n|0, allowSelf, kind, label, skip, confirmLabel}
function actionSpec(){
  if(state.phase==="vote"){ return {seats:1,center:0,allowSelf:true,label:"点选你要投出局的玩家",confirmLabel:"确认投票"}; }

    sentinel:{seats:1,label:"选一名其他玩家放置护盾",skip:"不放置",confirmLabel:"放置护盾"},
    doppelganger:{seats:1,label:"选一名其他玩家,查看并成为那个角色",confirmLabel:"查看"},

    mysticwolf:{seats:1,center:1,either:true,label:"看一名其他玩家的牌,或看一张中央牌",skip:"不看",confirmLabel:"查看"},
    alphawolf:{seats:1,label:"选一名非狼人玩家,把中央横放的狼人牌换给他(必须)",confirmLabel:"交换"},
    seer:{seats:1,center:2,either:true,label:"看一名其他玩家的牌,或看两张中央牌",skip:"不看",confirmLabel:"查看"},
    apprenticeseer:{center:1,label:"选一张中央牌查看",skip:"不看",confirmLabel:"查看"},
    pi:{seats:1,label:`选一名其他玩家查看(${(sub.viewed||[]).length}/2)`,skip:(sub.viewed||[]).length?"结束":"不看",confirmLabel:"查看"},
    robber:{seats:1,label:"选一名其他玩家,交换并查看你的新牌",skip:"不换",confirmLabel:"交换"},
    witch:sub.witchIdx==null?{center:1,label:"选一张中央牌查看(看了就必须换给一名玩家)",skip:"不看",confirmLabel:"查看"}:{seats:1,allowSelf:true,label:`把中央第 ${sub.witchIdx+1} 张牌换给哪名玩家?(可以是自己)`,confirmLabel:"交换"},
    troublemaker:{seats:2,label:"依次选两名其他玩家,交换他们的牌",skip:"不换",confirmLabel:"确认交换"},
    villageidiot:{dir:true,label:"把其他所有玩家的牌向左或向右移一位",skip:"不动"},
    drunk:{center:1,label:"选一张中央牌与之交换(必须,不能看)",confirmLabel:"交换",skip:state.seats[n].shield?"被护盾,跳过":null},
    revealer:{seats:1,label:"选一名其他玩家翻开他的牌(狼人/皮匠会翻回去)",skip:"不翻",confirmLabel:"翻开"},
    curator:{seats:1,allowSelf:true,label:"选一名玩家(可以是自己)放置随机神器",skip:"不放",confirmLabel:"放置"},
    copycat:{center:1,label:"选一张中央牌查看并成为那个角色(必须)",confirmLabel:"查看"},
    vampire:{seats:1,label:"吸血鬼们任选一人:点一名非吸血鬼玩家放置吸血鬼印记(必须)",confirmLabel:"放置印记"},
    count:{seats:1,label:"点一名非吸血鬼玩家放置恐惧印记(必须)",confirmLabel:"放置印记"},
    diseased:{seats:1,neighbors:true,label:"点你左边或右边的邻座放置疾病印记(必须)",confirmLabel:"放置印记"},
    cupid:{seats:2,allowSelf:true,label:"依次点两名玩家(可含自己)放置爱之印记",skip:"不放",confirmLabel:"放置印记"},
    instigator:{seats:1,allowSelf:true,label:"点一名玩家(可含自己)放置叛徒印记",skip:"不放",confirmLabel:"放置印记"},
    priest:{seats:1,label:"你已有清明印记;可再点一名其他玩家也放一枚",skip:"不放",confirmLabel:"放置印记"},
    assassin:{seats:1,allowSelf:true,label:"点一名玩家(可含自己)放置刺客印记(必须)",confirmLabel:"放置印记"},
    apprenticeassassin:{seats:1,allowSelf:true,label:"没有刺客在场:由你点一名玩家放置刺客印记(必须)",confirmLabel:"放置印记"},
    marksman:{marksman:true,seats:1,allowSelf:true,label:"先选「看牌」或「看印记」,再点玩家;两样可各选一人(不能同一人)",skip:"不看",confirmLabel:"查看"},
    nostradamus:{center:1,label:`依次点中央牌查看(${(sub.viewed||[]).length}/3);看到非村民牌即停止`,skip:(sub.viewed||[]).length?"停止":"不看",confirmLabel:"查看"},
    pickpocket:{seats:1,label:"点一名其他玩家,交换印记并查看新印记",skip:"不换",confirmLabel:"交换印记"},
    gremlin:{gremlin:true,seats:2,allowSelf:true,label:"先选换「牌」还是换「印记」,再依次点两名玩家",skip:"不换",confirmLabel:"确认交换"},
    thing:{dir:true,tap:true,label:"拍左边还是右边邻座的肩膀?",skip:"不拍"},

    beholder:{seats:1,targets:true,label:`查看预言家/学徒的牌(${(sub.viewed||[]).length}/${(sub.targets||[]).length})`,skip:"不看了",confirmLabel:"查看"},

function selectableSets(){ // 哪些座位/中央牌可点
  const sp=actionSpec(); const out={seats:new Set(),center:new Set()}; if(!sp) return out;
  const n=curActSeat();
  if(sp.seats){ for(const s of seatsArr()){ if(s.seatNo===n&&!sp.allowSelf) continue; if(state.phase==="night"&&s.shield&&!(sp.eff==="sentinel")) continue; out.seats.add(s.seatNo);} }
  if(sp.center){ for(let i=0;i<state.centerCount;i++) out.center.add(i); }
  if(sp.either){ if(sel.seats.length) out.center.clear(); if(sel.center.length) out.seats.clear(); }
  if(sp.seats&&sel.seats.length>=sp.seats&&!sp.either) out.seats=new Set(sel.seats);
  if(sp.center&&sel.center.length>=sp.center&&!sp.either) out.center=new Set(sel.center);
  if(sp.eff==="sentinel"){ for(const s of seatsArr()) if(s.seatNo!==n) out.seats.add(s.seatNo); }
  const sub=state.phase==="night"?((state.night.me[n]||{}).sub||{}):{};
  if(sp.eff==="pi"){ for(const x of (sub.viewed||[])) out.seats.delete(x); }
  if(sp.neighbors){ const seats=seatsArr().map(s=>s.seatNo), i=seats.indexOf(n); const nb=new Set([seats[(i+1)%seats.length],seats[(i+seats.length-1)%seats.length]]); for(const x of [...out.seats]) if(!nb.has(x)) out.seats.delete(x); }
  if(sp.targets){ out.seats=new Set((sub.targets||[]).filter(x=>!(sub.viewed||[]).includes(x))); }
  if(sp.eff==="nostradamus"){ for(const x of (sub.viewed||[])) out.center.delete(x); }
  if(sp.marksman){ out.seats=new Set(seatsArr().map(s=>s.seatNo).filter(x=>mmMode==="card"?(x!==n&&!state.seats[x].shield):true)); }
  return out;
}
function viewTable(){
  const seats=seatsArr(), N=seats.length, over=state.phase==="over", r=state.result;
  const sets=selectableSets(); const n=curActSeat();
  let h=`<div class="table${N>=14?" huge":N>=11?" big":""}" id="table">`;
  seats.forEach((s,i)=>{
    const mine=state.youHold.includes(s.seatNo);
    const canSel=sets.seats.has(s.seatNo), isSel=(state.phase==="vote"?voteSel===s.seatNo:sel.seats.includes(s.seatNo));
    const face=over?r.final[s.seatNo]:(s.revealed||null);
    const speaker=state.phase==="day"&&state.day.speaker===s.seatNo;
    const dead=over&&r.deaths.includes(s.seatNo);
    let cls="pc"+(mine?" mine":"")+(canSel?" selectable":"")+(isSel?" sel":"")+(face?" face "+rteam(face):"")+(speaker?" speaker":"")+(dead?" dead":"")+((actionSpec()&&!canSel&&!isSel)?" dim":"");
    let inner=face?`${cimg(face)}<div class="fx"><div class="ic">${ric(face)}</div><div class="rn">${esc(rn(face))}</div><div class="nm">${s.seatNo}号 ${esc(nameOf(s))}</div>${over&&s.mark?`<div class="mk">${mkIcon(s.mark)}${esc(mkName(s.mark))}</div>`:""}</div>`:`<div class="no">${s.seatNo}</div><div class="nm">${esc(nameOf(s))||"空位"}</div>`;
    if(s.shield) inner+=`<div class="bd" title="护盾">🛡️</div>`;
    else if(s.hasArtifact) inner+=`<div class="bd" title="神器">🏺</div>`;
    if(s.hasMark&&!over) inner+=`<div class="bd3" title="有印记">🔖</div>`;
    if(state.phase==="vote"&&s.hasVoted) inner+=`<div class="bd2" title="已投票">✓</div>`;
    if(over&&r.votes[s.seatNo]!=null) inner+=`<div class="bd2" title="投给">→${r.votes[s.seatNo]}</div>`;
    if(speaker) inner+=`<div class="mic">🎤</div>`;
    if(dead) inner+=`<div class="dead-x">✖</div>`;
    h+=`<div class="${cls}" data-a="seatClick" data-s="${s.seatNo}" data-i="${i}" data-n="${N}">${inner}</div>`;
  });
  // 中央牌:头狼横牌在上,三张竖牌在下
  const cc=i=>{ const canSel=sets.center.has(i), isSel=sel.center.includes(i); const face=over?r.center[i]:null;
    return `<div class="cc${i===state.wolfSlot?" h":""}${canSel?" selectable":""}${isSel?" sel":""}${face?" face "+rteam(face):""}" data-a="centerClick" data-c="${i}">${face?`${cimg(face)}<div class="fx"><div class="ic">${ric(face)}</div><div class="rn">${esc(rn(face))}</div></div>`:(i===state.wolfSlot?"狼人牌":"中央 "+(i+1))}</div>`; };
  h+=`<div class="center">${state.wolfSlot!=null?cc(state.wolfSlot):""}<div class="rowc">${[0,1,2].filter(i=>i<state.centerCount).map(cc).join("")}</div></div>`;
  h+=`</div>`;
  return h;
}
function layoutTable(){ // 座位围成一圈:1 号在正上方,顺时针
  const t=$("#table"); if(!t) return;
  for(const el of t.querySelectorAll(".pc")){ const i=+el.dataset.i, N=+el.dataset.n; const a=-Math.PI/2+2*Math.PI*i/N; const R0=N>=11?43:41; el.style.left=(50+R0*Math.cos(a))+"%"; el.style.top=(50+R0*Math.sin(a))+"%"; }
}

  const r=state.result;
  let h=`<div class="card result"><div class="big">${r.winTeams.length?r.winTeams.map(t=>tmHtml(t)).join(" "):"无人获胜"}</div>`;
  h+=`<div class="ln">${r.deaths.length?"☠️ 出局:"+r.deaths.map(n=>`${n}号(${rn(r.final[n])})`).join("、"):"无人出局"}</div>`;
  h+=r.lines.map(l=>`<div class="ln">${esc(l)}</div>`).join("");
  h+=`<div class="ln">🏆 赢家:${r.winners.length?r.winners.map(n=>n+"号").join("、"):"无"}</div>`;
  h+=`<table class="vt">${seatsArr().map(s=>{ const f=r.final[s.seatNo]; return `<tr><td><b>${s.seatNo}号</b> ${esc(nameOf(s))}</td><td>${ric(s.initRole)} ${esc(rn(s.initRole))}${s.card!==s.initRole?` → ${ric(s.card)} ${esc(rn(s.card))}`:""}${f!==s.card?` ⇒ ${esc(rn(f))}`:""}${s.artifact?` 🏺${esc(ART[s.artifact].name)}`:""}${s.mark?` ${mkIcon(s.mark)}${esc(mkName(s.mark))}`:""}</td><td>${tmHtml(s.team)}</td><td>${r.votes[s.seatNo]!=null?"投 "+r.votes[s.seatNo]+"号":"弃票"} · 得 ${r.tally[s.seatNo]} 票${r.winners.includes(s.seatNo)?" 🏆":""}</td></tr>`; }).join("")}</table>`;
  h+=`<details style="margin-top:8px"><summary>🌙 夜里发生了什么</summary><div class="log">${(state.nightLog||[]).map(l=>`<div>${esc(l)}</div>`).join("")||"<div>没有任何行动</div>"}</div></details>`;
  h+=`<div class="row" style="margin-top:10px"><button class="primary grow" data-a="newGame">再来一局(保留配置)</button></div></div>`;
  return h;
}
function viewMyRoles(){
  const ms=mySeats(); if(!ms.length) return "";
  let h=`<div class="card secret"><h2>🪪 我的身份 <span class="tag">只有本机可见</span></h2>`;
  for(const n of ms){ const s=state.seats[n]; const r=R[s.initRole]; if(!r) continue;
    h+=`<div class="rolebig ${r.team}">${rimg(r.key)?`<img class="rimg big" src="${esc(rimg(r.key))}" alt="" onerror="this.outerHTML='<div class=ic>${r.icon}</div>'"/>`:`<div class="ic">${r.icon}</div>`}<div class="grow"><div class="rn">${n}号 · ${esc(r.name)} ${tmHtml(r.team)}</div><div class="re">${esc(r.desc)}</div>${state.phase!=="night"&&s.artifact?`<div style="margin-top:4px"><button class="xs warn" data-a="artifact" data-s="${n}">🏺 看我的神器</button></div>`:""}</div></div>`;
    if(state.phase!=="night") h+=notesHtml(s);
  }
  h+=`<div class="hint">⚠ 你面前的牌可能已经被换走——你只知道自己拿到的初始角色和夜里看到的信息。</div></div>`;
  return h;
}
function viewLog(){ return `<div class="card"><details><summary>📜 日志(公开)</summary><div class="log">${(state.log||[]).map(l=>`<div>${esc(l)}</div>`).join("")}</div></details></div>`; }

/* ============ 交互 ============ */
function onSeatClick(n){
  if(state.phase==="vote"){ if(!mySeats().length) return; voteSel=n; render(); return; }
  const sp=actionSpec(); if(!sp||!sp.seats) return;
  const sets=selectableSets();
  if(sp.marksman){ if(!sets.seats.has(n)) return; if(mmMode==="card"){ sel.mmCard=sel.mmCard===n?null:n; if(sel.mmMark===n) sel.mmMark=null; } else { sel.mmMark=sel.mmMark===n?null:n; if(sel.mmCard===n) sel.mmCard=null; } render(); return; }
  if(!sets.seats.has(n)&&!sel.seats.includes(n)) return;
  if(sel.seats.includes(n)) sel.seats=sel.seats.filter(x=>x!==n);
  else { if(sel.seats.length>=sp.seats) sel.seats.shift(); sel.seats.push(n); sel.center=[]; }
  render();
}
function onCenterClick(i){
  const sp=actionSpec(); if(!sp||!sp.center) return;
  const sets=selectableSets(); if(!sets.center.has(i)&&!sel.center.includes(i)) return;
  if(sel.center.includes(i)) sel.center=sel.center.filter(x=>x!==i);
  else { if(sel.center.length>=sp.center) sel.center.shift(); sel.center.push(i); sel.seats=[]; }
  render();
}
function confirmAction(){
  const sp=actionSpec(); const n=curActSeat(); if(!sp||n==null) return;
  const base={seatNo:n}; let msg=null;
  switch(sp.eff){
    case "sentinel": msg={kind:"shield",target:sel.seats[0]}; break;
    case "doppelganger": msg={kind:"copy",target:sel.seats[0]}; break;
    case "werewolf": case "apprenticeseer": msg={kind:"peekCenter",idx:sel.center[0]}; break;
    case "pi": msg={kind:"peekPlayer",target:sel.seats[0]}; break;
    case "mysticwolf": msg=sel.seats.length?{kind:"peekPlayer",target:sel.seats[0]}:{kind:"peekCenter",idx:sel.center[0]}; break;
    case "alphawolf": msg={kind:"swapCenter",target:sel.seats[0]}; break;
    case "seer": msg=sel.seats.length?{kind:"peekPlayer",target:sel.seats[0]}:{kind:"peekCenter",idxs:sel.center.slice(0,2)}; break;
    case "robber": msg={kind:"swapSelf",target:sel.seats[0]}; break;
    case "witch": msg=sel.center.length?{kind:"peekCenter",idx:sel.center[0]}:{kind:"swapCenter",target:sel.seats[0]}; break;
    case "troublemaker": msg={kind:"swapTwo",a:sel.seats[0],b:sel.seats[1]}; break;
    case "drunk": msg={kind:"swapCenter",idx:sel.center[0]}; break;
    case "revealer": msg={kind:"reveal",target:sel.seats[0]}; break;
    case "curator": msg={kind:"artifact",target:sel.seats[0]}; break;
    case "copycat": case "nostradamus": msg={kind:"peekCenter",idx:sel.center[0]}; break;
    case "vampire": case "count": case "diseased": case "instigator": case "priest": case "assassin": case "apprenticeassassin": msg={kind:"mark",target:sel.seats[0]}; break;
    case "cupid": msg={kind:"markTwo",a:sel.seats[0],b:sel.seats[1]}; break;
    case "marksman": msg={kind:"marksman",cardTarget:sel.mmCard,markTarget:sel.mmMark}; break;
    case "pickpocket": msg={kind:"swapMark",target:sel.seats[0]}; break;
    case "gremlin": msg={kind:"swapTwo",a:sel.seats[0],b:sel.seats[1],what:grWhat}; break;
    case "squire": case "beholder": msg={kind:"peekPlayer",target:sel.seats[0]}; break;
  }
  if(!msg) return;
  act("nightAct",Object.assign(base,msg)); sel={seats:[],center:[]};
}
function sendConfig(patch){ act("setConfig",{config:patch}); }
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, sn=+b.dataset.s;
  switch(a){
    case "close": closeModal(); break;
    case "closeMask": if(e.target===b) closeModal(); break;
    case "rename": RC.promptRename(); break;
    case "codex": openCodex(); break;
    case "codexOf": openCodex(b.dataset.k); break;
    case "narr": setNarr(!narrOn); break;
    case "voice": openVoiceSettings(); break;
    case "vcTest": applyVoiceSettings(); { const was=narrOn; narrOn=true; speak("狼人 Werewolf,请睁眼,互相确认身份。",true,()=>{ narrOn=was; }); } break;
    case "disband": if(confirm("解散房间?所有人都会被踢出,房间数据清空。")) RC.send({type:"disbandRoom"}); break;
    case "claim": RC.send({type:"claimSeat",seatNo:sn}); break;
    case "takeover": { const s=state.seats[sn]; if(confirm(`座位 ${sn} 当前由「${nameOf(s)}」持有,替换成你?`)) RC.send({type:"takeoverSeat",seatNo:sn}); break; }
    case "release": RC.send({type:"releaseSeat",seatNo:sn}); break;
    case "addSeat": RC.send({type:"addSeat"}); break;
    case "removeSeat": { const last=seatsArr().at(-1); if(!last||!last.holderDevices.length||confirm(`${last.seatNo} 号座位有人,确定删除?`)) RC.send({type:"removeSeat"}); break; }
    case "roleInc": act("setRoles",{roles:state.roles.concat([b.dataset.k])}); break;
    case "roleDec": { const i=state.roles.indexOf(b.dataset.k); if(i>=0){ const r=state.roles.slice(); r.splice(i,1); act("setRoles",{roles:r}); } break; }
    case "recommend": act("recommendRoles"); break;
    case "useLast": { const L=loadLast(); if(!L) break; act("setRoles",{roles:L.roles}); if(L.config) act("setConfig",{config:L.config}); toast("已沿用上次配置"+(L.seats!==seatsArr().length?"(上次 "+L.seats+" 人,注意座位数)":"")); break; }
    case "clearRoles": act("setRoles",{roles:[]}); break;
    case "roundDel": { const r=state.config.rounds.slice(); r.splice(+b.dataset.i,1); sendConfig({rounds:r}); break; }
    case "roundAdd": sendConfig({rounds:state.config.rounds.concat([{mode:"order"}])}); break;
    case "start": if(!narrOn) setNarr(true); saveLast(); act("startGame"); break;
    case "actSeat": actSeat=sn; sel={seats:[],center:[]}; voteSel=null; render(); break;
    case "seatClick": onSeatClick(sn); break;
    case "centerClick": onCenterClick(+b.dataset.c); break;
    case "confirm": confirmAction(); break;
    case "clearSel": sel={seats:[],center:[]}; mmMode="card"; render(); break;
    case "skip": act("nightAct",{seatNo:curActSeat(),kind:"skip"}); sel={seats:[],center:[]}; break;
    case "shift": act("nightAct",{seatNo:curActSeat(),kind:"shift",dir:b.dataset.d}); break;
    case "tap": act("nightAct",{seatNo:curActSeat(),kind:"tap",dir:b.dataset.d}); break;
    case "mmMode": mmMode=b.dataset.m; render(); break;
    case "grWhat": grWhat=b.dataset.w; render(); break;
    case "forceNight": if(confirm("强制进入下一阶段?未完成的行动将作废。")) act("nightAdvance",{force:true}); break;
    case "endSpeech": act("dayNext"); break;
    case "forceSpeech": if(confirm("强制结束当前发言,换下一位?")) act("dayNext",{force:true}); break;
    case "endRound": if(confirm("提前结束本轮讨论?")) act("dayNext",{force:true}); break;
    case "startVote": if(confirm("跳过剩余发言,直接开始投票?")) act("startVote"); break;
    case "voteConfirm": if(voteSel!=null){ act("vote",{seatNo:curActSeat(),target:voteSel}); } break;
    case "forceVote": if(confirm("强制结束投票?未投的按弃票。")) act("closeVote",{force:true}); break;
    case "artifact": openArtifact(sn); break;
    case "newGame": if(state.phase==="over"||confirm("终止本局回到准备阶段?")) act("newGame"); break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.a==="roundMode"){ const r=state.config.rounds.map((x,i)=>i===+t.dataset.i?{mode:t.value}:x); sendConfig({rounds:r}); return; }
  if(!t.id) return;
  if(t.id==="vote-no"){ const v=+t.value; if(v>=1&&state.seats[v]){ voteSel=v; render(); } else if(t.value) toast("座位号不对"); return; }
  if(t.id&&t.id.startsWith("vc-")){ applyVoiceSettings(); return; }
  if(t.id.startsWith("cf-")){
    const k=t.id.slice(3);
    if(k==="anchor") return sendConfig({anchor:t.checked});
    if(k==="freeMin") return sendConfig({freeSec:Math.round((+t.value||0)*60)});
    sendConfig({[k]:+t.value});
  }
});
document.getElementById("rcNow").onclick=()=>RC.reconnectNow();
render();
</script>
</body>
